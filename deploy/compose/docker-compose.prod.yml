name: ${PROJECT_NAME:-smartupcms}

x-server-common: &server-common
  image: ${SERVER_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/server:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
  restart: unless-stopped
  environment:
    DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartupcms}
    DB_USER: ${DB_USER:?DB_USER is required}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    WAREHOUSE_URL: jdbc:postgresql://postgres:5432/${WAREHOUSE_DB_NAME:-smartupcms_dwh}
    WAREHOUSE_USERNAME: ${DB_USER:?DB_USER is required}
    WAREHOUSE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    WAREHOUSE_CONNECT_TIMEOUT: ${WAREHOUSE_CONNECT_TIMEOUT:-5s}
    WAREHOUSE_STATEMENT_TIMEOUT: ${WAREHOUSE_STATEMENT_TIMEOUT:-60s}
    WAREHOUSE_MAINTENANCE_STATEMENT_TIMEOUT: ${WAREHOUSE_MAINTENANCE_STATEMENT_TIMEOUT:-30m}
    WAREHOUSE_RAW_WRITE_TIMEOUT: ${WAREHOUSE_RAW_WRITE_TIMEOUT:-30m}
    SMC_DB_STATEMENT_TIMEOUT: ${SMC_DB_STATEMENT_TIMEOUT:-60s}
    SMC_DB_IDLE_IN_TRANSACTION_TIMEOUT: ${SMC_DB_IDLE_IN_TRANSACTION_TIMEOUT:-60s}
    # Journal retention (docs/ops/operations-runbook.md, ADR-0025): days a row lives; 0 keeps a journal whole.
    SMC_RETENTION_CRON: ${SMC_RETENTION_CRON:-0 30 3 * * *}
    SMC_RETENTION_BATCH_SIZE: ${SMC_RETENTION_BATCH_SIZE:-5000}
    SMC_RETENTION_MAX_BATCHES: ${SMC_RETENTION_MAX_BATCHES:-200}
    SMC_RETENTION_SECURITY_EVENTS_DAYS: ${SMC_RETENTION_SECURITY_EVENTS_DAYS:-365}
    SMC_RETENTION_LOGIN_ATTEMPTS_DAYS: ${SMC_RETENTION_LOGIN_ATTEMPTS_DAYS:-30}
    SMC_RETENTION_OTP_CODES_DAYS: ${SMC_RETENTION_OTP_CODES_DAYS:-7}
    SMC_RETENTION_PASSWORD_RESET_CODES_DAYS: ${SMC_RETENTION_PASSWORD_RESET_CODES_DAYS:-7}
    SMC_RETENTION_CLOSED_SESSIONS_DAYS: ${SMC_RETENTION_CLOSED_SESSIONS_DAYS:-90}
    SMC_RETENTION_WEBHOOK_LOGS_DAYS: ${SMC_RETENTION_WEBHOOK_LOGS_DAYS:-90}
    SMC_RETENTION_WEBHOOK_OUTBOX_DAYS: ${SMC_RETENTION_WEBHOOK_OUTBOX_DAYS:-30}
    SMC_RETENTION_INBOX_DAYS: ${SMC_RETENTION_INBOX_DAYS:-180}
    SMC_RETENTION_NOTIFICATION_OUTBOX_DAYS: ${SMC_RETENTION_NOTIFICATION_OUTBOX_DAYS:-30}
    SMC_RETENTION_JOB_RUNS_DAYS: ${SMC_RETENTION_JOB_RUNS_DAYS:-90}
    SMC_RETENTION_FAILED_JOBS_DAYS: ${SMC_RETENTION_FAILED_JOBS_DAYS:-90}
    SMC_RETENTION_SEARCH_JOBS_DAYS: ${SMC_RETENTION_SEARCH_JOBS_DAYS:-90}
    SMC_JOBS_MAX_ATTEMPTS: ${SMC_JOBS_MAX_ATTEMPTS:-5}
    SMC_JOBS_RETRY_BACKOFF: ${SMC_JOBS_RETRY_BACKOFF:-30s}
    SMC_JOBS_RETRY_BACKOFF_MAX: ${SMC_JOBS_RETRY_BACKOFF_MAX:-1h}
    SMC_JOBS_LEASE: ${SMC_JOBS_LEASE:-5m}
    SMC_INSTANCE_CLIENT_CODE: ${ORGANIZATION_CODE:-default}
    SMC_INSTANCE_CLIENT_NAME: ${ORGANIZATION_NAME:?ORGANIZATION_NAME is required}
    SMC_INSTANCE_RESOURCE_PROFILE: ${RESOURCE_PROFILE:-S}
    SMC_INSTANCE_ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
    SMC_INSTANCE_ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    SMC_INSTANCE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    # Invitation and password reset links are built from it; the server refuses to start without it.
    SMC_PUBLIC_URL: ${SMC_PUBLIC_URL:?SMC_PUBLIC_URL is required (https://cms.example.com)}
    SMC_LOG_FILE: ${SMC_LOG_FILE:-/var/lib/smartupcms/logs/server.log}
    SMC_AUDIT_ARCHIVE_ENABLED: ${SMC_AUDIT_ARCHIVE_ENABLED:-true}
    SMC_AUDIT_ARCHIVE_TARGET: ${SMC_AUDIT_ARCHIVE_TARGET:-local}
    SMC_AUDIT_ARCHIVE_LOCAL_PATH: ${SMC_AUDIT_ARCHIVE_LOCAL_PATH:-/var/lib/smartupcms/audit-archive}
    SMC_AUDIT_ARCHIVE_INTERVAL: ${SMC_AUDIT_ARCHIVE_INTERVAL:-7d}
    SMC_AUDIT_ARCHIVE_SIZE_THRESHOLD: ${SMC_AUDIT_ARCHIVE_SIZE_THRESHOLD:-100MB}
    SMC_AUDIT_ARCHIVE_RETENTION: ${SMC_AUDIT_ARCHIVE_RETENTION:-90d}
    SMC_AUDIT_ARCHIVE_DELETE_AFTER_ARCHIVE: ${SMC_AUDIT_ARCHIVE_DELETE_AFTER_ARCHIVE:-false}
    SMC_AUDIT_ARCHIVE_S3_ENDPOINT: ${SMC_AUDIT_ARCHIVE_S3_ENDPOINT:-}
    SMC_AUDIT_ARCHIVE_S3_REGION: ${SMC_AUDIT_ARCHIVE_S3_REGION:-auto}
    SMC_AUDIT_ARCHIVE_S3_ACCESS_KEY: ${SMC_AUDIT_ARCHIVE_S3_ACCESS_KEY:-}
    SMC_AUDIT_ARCHIVE_S3_SECRET_KEY: ${SMC_AUDIT_ARCHIVE_S3_SECRET_KEY:-}
    SMC_AUDIT_ARCHIVE_S3_BUCKET: ${SMC_AUDIT_ARCHIVE_S3_BUCKET:-}
    SMC_AUDIT_ARCHIVE_S3_PREFIX: ${SMC_AUDIT_ARCHIVE_S3_PREFIX:-audit/}
    SMC_AUDIT_ARCHIVE_S3_PATH_STYLE: ${SMC_AUDIT_ARCHIVE_S3_PATH_STYLE:-true}
    SMC_AUDIT_ARCHIVE_CRON: ${SMC_AUDIT_ARCHIVE_CRON:-0 45 3 * * *}
    SMC_PROVIDER_STORAGE: ${SMC_PROVIDER_STORAGE:-local_disk}
    SMC_STORAGE_LOCAL_PATH: /var/lib/smartupcms/storage
    SMC_BACKUP_STATUS_FILE: /var/lib/smartupcms/backup/status.json
    SMC_SYSTEM_HEALTH_TIMEOUT: ${SMC_SYSTEM_HEALTH_TIMEOUT:-2s}
    SMC_BACKUP_MAX_AGE: ${SMC_BACKUP_MAX_AGE:-0s}
    SMC_WEBHOOKS_ENABLED: ${SMC_WEBHOOKS_ENABLED:-false}
    SMC_WEBHOOKS_ALLOWED_HOSTS: ${SMC_WEBHOOKS_ALLOWED_HOSTS:-}
    SMC_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES: ${SMC_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES:-false}
    SMC_WEBHOOKS_CONNECT_TIMEOUT: ${SMC_WEBHOOKS_CONNECT_TIMEOUT:-3s}
    SMC_WEBHOOKS_READ_TIMEOUT: ${SMC_WEBHOOKS_READ_TIMEOUT:-10s}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
    SMC_MAIL_FROM: ${SMC_MAIL_FROM:-no-reply@localhost}
    SMC_MAIL_FROM_NAME: ${SMC_MAIL_FROM_NAME:-SmartupCMS}
    TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    # console_mail writes nothing but "not delivered" to the log; while SMC_DELIVERY_ENFORCE is true the server
    # refuses to start on it: set SMC_PROVIDER_MAIL=smtp with SMTP_HOST, or SMC_DELIVERY_ENFORCE=false knowingly.
    SMC_PROVIDER_MAIL: ${SMC_PROVIDER_MAIL:-console_mail}
    SMC_PROVIDER_SMS: ${SMC_PROVIDER_SMS:-console_sms}
    SMC_PROVIDER_MESSENGER: ${SMC_PROVIDER_MESSENGER:-console_messenger}
    SMC_DELIVERY_ENFORCE: ${SMC_DELIVERY_ENFORCE:-true}
    # ADR-0029: encrypts the secrets kept in the database; the server refuses to start without it.
    SMC_SECRETS_KEY: ${SMC_SECRETS_KEY:?SMC_SECRETS_KEY is required}
    SMC_S3_ENDPOINT: ${SMC_S3_ENDPOINT:-}
    SMC_S3_REGION: ${SMC_S3_REGION:-auto}
    SMC_S3_ACCESS_KEY: ${SMC_S3_ACCESS_KEY:-}
    SMC_S3_SECRET_KEY: ${SMC_S3_SECRET_KEY:-}
    SMC_S3_BUCKET: ${SMC_S3_BUCKET:-}
    SMC_S3_PATH_STYLE: ${SMC_S3_PATH_STYLE:-true}
    # Production file uploads are fail-closed. Development Compose remains
    # optional, but the supported production topology cannot disable scanning.
    SMC_FILE_SCANNER_REQUIRED: "true"
    SMC_FILE_SCANNER_CLAMAV_ENABLED: "true"
    SMC_FILE_SCANNER_CLAMAV_HOST: ${SMC_FILE_SCANNER_CLAMAV_HOST:-clamav}
    SMC_FILE_SCANNER_CLAMAV_PORT: ${SMC_FILE_SCANNER_CLAMAV_PORT:-3310}
    SMC_FILE_SCANNER_CLAMAV_CONNECT_TIMEOUT: ${SMC_FILE_SCANNER_CLAMAV_CONNECT_TIMEOUT:-3s}
    SMC_FILE_SCANNER_CLAMAV_READ_TIMEOUT: ${SMC_FILE_SCANNER_CLAMAV_READ_TIMEOUT:-60s}
    SMC_RATE_LIMIT_PUBLIC_READ_PER_MINUTE: ${SMC_RATE_LIMIT_PUBLIC_READ_PER_MINUTE:-600}
    SMC_TYPESENSE_URL: http://typesense:8108
    SMC_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
    SMC_TYPESENSE_ENABLED: ${SMC_TYPESENSE_ENABLED:-true}
    MANAGEMENT_PORT: 9090
    TZ: UTC
  networks: [backend]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  # JNA extracts Argon2's native library at startup. Keep generic /tmp noexec,
  # but provide one private executable tmpfs for that library only.
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=1024m
    - /opt/smartupcms/jna:rw,nosuid,nodev,exec,size=16m,uid=10001,gid=10001,mode=0700
  deploy:
    resources:
      limits:
        cpus: "2.0"
        memory: 1536M
      reservations:
        memory: 512M
  logging:
    driver: json-file
    options: {max-size: "100m", max-file: "5", compress: "true"}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/postgres:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartupcms}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-smartupcms_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      APP_DB_USER: ${DB_USER:-smartupcms}
      APP_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      BACKUP_DB_USER: ${BACKUP_DB_USER:-smartupcms_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-smartupcms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 1m
    shm_size: 256mb
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5", compress: "true"}

  migrate:
    <<: *server-common
    profiles: [tools]
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartupcms}
      DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${DB_PASSWORD:?DB_PASSWORD is required}}
      WAREHOUSE_URL: jdbc:postgresql://postgres:5432/${WAREHOUSE_DB_NAME:-smartupcms_dwh}
      WAREHOUSE_USERNAME: ${DB_USER:?DB_USER is required}
      WAREHOUSE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      WAREHOUSE_CONNECT_TIMEOUT: ${WAREHOUSE_CONNECT_TIMEOUT:-5s}
      SMC_MIGRATE_SCOPE: warehouse
    # ADR-0001, two databases: MigrateMain applies db/dwh only (SMC_MIGRATE_SCOPE=warehouse, connecting with the
    # WAREHOUSE_* settings above), then the regular migrate profile
    # applies db/migration as before (SPRING_FLYWAY_TARGET and other Flyway settings keep working).
    # WarehouseSchemaVersionGate checks pg-dwh on every Spring context start (the migrate profile included),
    # so db/dwh has to be applied before the first context start. All arguments are inline: nothing is lost in sh -c.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        java -cp "app.jar:lib/*:/app/modules/*" com.smartup24.cms.instance.warehouse.migration.MigrateMain
        && exec java -cp "app.jar:lib/*:/app/modules/*" com.smartup24.cms.instance.InstanceApplication --spring.profiles.active=migrate
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}

  server:
    <<: *server-common
    networks: [frontend, backend]
    volumes:
      - server-data:/var/lib/smartupcms
      - backup-status:/var/lib/smartupcms/backup:ro
    depends_on:
      postgres: {condition: service_healthy}
      typesense: {condition: service_healthy}
      clamav: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 60s
    stop_grace_period: 30s

  web:
    image: ${WEB_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/web:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    restart: unless-stopped
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:8080"
    networks: [frontend]
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777
      - /var/lib/nginx/tmp:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=0700
      - /run/nginx:rw,nosuid,nodev,noexec,uid=10001,gid=10001,mode=0750
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5", compress: "true"}

  typesense:
    image: ${TYPESENSE_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/typesense:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "false"
    volumes:
      - typesense-data:/data
    networks: [backend]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/8108;
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '\"ok\":true' <&3"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5", compress: "true"}

  clamav:
    # Official multi-architecture image, pinned to both a security-patched
    # release and its immutable OCI index digest.
    image: ${CLAMAV_IMAGE:-clamav/clamav-debian:1.5.4@sha256:df80497be841a8ad57f95e04f978216241457f8f8ad608f1f682e3cd0fe63c45}
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    networks: [backend, egress]
    security_opt: [no-new-privileges:true]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          memory: 1024M
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5", compress: "true"}

  backup-bootstrap:
    image: ${BACKUP_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/backup:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    profiles: [tools]
    restart: "no"
    entrypoint: ["/usr/local/bin/bootstrap-role"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-smartupcms}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-smartupcms_dwh}
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD_FILE: /run/secrets/postgres_password
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      MIGRATE_DB_PASSWORD_FILE: /run/secrets/migrate_database_password
      APP_DB_USER: ${DB_USER:-smartupcms}
      APP_DB_PASSWORD_FILE: /run/secrets/database_password
      BACKUP_DB_USER: ${BACKUP_DB_USER:-smartupcms_backup}
      BACKUP_DB_PASSWORD_FILE: /run/secrets/backup_database_password
    secrets:
      - postgres_password
      - migrate_database_password
      - database_password
      - backup_database_password
    networks: [backend]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]

  backup:
    image: ${BACKUP_IMAGE:-${IMAGE_REGISTRY:-ghcr.io/smartupcms}/backup:${APP_VERSION:?APP_VERSION must be an immutable release tag}}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-smartupcms}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-smartupcms_dwh}
      PGUSER: ${BACKUP_DB_USER:-smartupcms_backup}
      PGPASSWORD_FILE: /run/secrets/backup_database_password
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:?BACKUP_AGE_RECIPIENT is required}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_STORAGE_MODE: ${BACKUP_STORAGE_MODE:-local}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-backups}
      BACKUP_S3_ACCESS_KEY_ID_FILE: /run/secrets/backup_s3_access_key_id
      BACKUP_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/backup_s3_secret_access_key
    secrets:
      - backup_database_password
      - backup_s3_access_key_id
      - backup_s3_secret_access_key
    volumes:
      - backups:/backups
      - backup-status:/status
    networks: [backend, egress]
    depends_on:
      postgres: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5", compress: "true"}

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true
  egress:
    driver: bridge

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}}
  migrate_database_password:
    file: ${MIGRATE_DB_PASSWORD_FILE:-${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}}
  database_password:
    file: ${DB_PASSWORD_FILE:?DB_PASSWORD_FILE is required}
  backup_database_password:
    file: ${BACKUP_DB_PASSWORD_FILE:?BACKUP_DB_PASSWORD_FILE is required}
  backup_s3_access_key_id:
    file: ${BACKUP_S3_ACCESS_KEY_ID_FILE:-${BACKUP_DB_PASSWORD_FILE:?BACKUP_DB_PASSWORD_FILE is required}}
  backup_s3_secret_access_key:
    file: ${BACKUP_S3_SECRET_ACCESS_KEY_FILE:-${BACKUP_DB_PASSWORD_FILE:?BACKUP_DB_PASSWORD_FILE is required}}

volumes:
  postgres-data:
  server-data:
  typesense-data:
  clamav-data:
  backups:
  backup-status:
