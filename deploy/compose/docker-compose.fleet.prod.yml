# ==============================================================================
# Smartup DWH / CMS Production Fleet & Multi-tenant Stack Orchestration
# ==============================================================================
name: ${PROJECT_NAME:-SmartupCMS}-fleet-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-common: &app-common
  image: ${IMAGE_REGISTRY:-smartupcms}/instance:${APP_VERSION:-1.0.0}
  restart: unless-stopped
  logging: *default-logging
  environment:
    JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2048m -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -Duser.timezone=UTC"
    DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-dwh_instance}
    DB_USER: ${DB_USER}
    DB_PASSWORD: ${DB_PASSWORD}
    DWH_INSTANCE_CLIENT_CODE: ${CLIENT_CODE:-prod-client}
    DWH_INSTANCE_CLIENT_NAME: ${CLIENT_NAME:-Enterprise Production Client}
    DWH_INSTANCE_RESOURCE_PROFILE: ${RESOURCE_PROFILE:-M}
    DWH_INSTANCE_ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
    DWH_INSTANCE_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@enterprise.local}
    DWH_INSTANCE_ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    DWH_CP_URL: ${DWH_CP_URL:-http://control-plane:8081}
    DWH_CP_HEARTBEAT_TOKEN: ${DWH_CP_HEARTBEAT_TOKEN}
    DWH_TYPESENSE_URL: http://typesense:8108
    DWH_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
    DWH_TYPESENSE_ENABLED: "true"
    MANAGEMENT_PORT: "9090"
    TZ: UTC
  networks:
    - internal-net

services:
  proxy:
    image: nginx:1.27-alpine
    container_name: ${PROJECT_NAME:-SmartupCMS}-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - control-plane
      - web
      - web-cp
    networks:
      - internal-net

  db:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-SmartupCMS}-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-dwh_instance}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db-data:/var/lib/postgresql
      - ./backups:/backups
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME:-dwh_instance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4096M

  migrate:
    <<: *app-common
    container_name: ${PROJECT_NAME:-SmartupCMS}-migrate
    profiles: [tools]
    command: ["--spring.profiles.active=migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  app:
    <<: *app-common
    container_name: ${PROJECT_NAME:-SmartupCMS}-app
    command: ["--spring.profiles.active=prod"]
    volumes:
      - app-storage:/var/lib/dwh/storage
    depends_on:
      db: { condition: service_healthy }
      typesense: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9090/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 3072M

  web:
    image: ${IMAGE_REGISTRY:-smartupcms}/web:${APP_VERSION:-1.0.0}
    container_name: ${PROJECT_NAME:-SmartupCMS}-web
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal-net

  typesense:
    image: typesense/typesense:27.1
    container_name: ${PROJECT_NAME:-SmartupCMS}-typesense
    restart: unless-stopped
    logging: *default-logging
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense-data:/data
    networks:
      - internal-net
    healthcheck:
      test: ["CMD", "typesense-server", "--health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-cp:
    image: postgres:18-alpine
    container_name: ${PROJECT_NAME:-SmartupCMS}-db-cp
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${CP_DB_NAME:-dwh_control_plane}
      POSTGRES_USER: ${CP_DB_USER}
      POSTGRES_PASSWORD: ${CP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db-cp-data:/var/lib/postgresql
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CP_DB_USER} -d ${CP_DB_NAME:-dwh_control_plane}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate-cp:
    image: ${IMAGE_REGISTRY:-smartupcms}/control-plane:${APP_VERSION:-1.0.0}
    container_name: ${PROJECT_NAME:-SmartupCMS}-migrate-cp
    profiles: [tools]
    command: ["--spring.profiles.active=migrate"]
    restart: "no"
    environment:
      DB_URL: jdbc:postgresql://db-cp:5432/${CP_DB_NAME:-dwh_control_plane}
      DB_USER: ${CP_DB_USER}
      DB_PASSWORD: ${CP_DB_PASSWORD}
    depends_on:
      db-cp: { condition: service_healthy }
    networks:
      - internal-net

  control-plane:
    image: ${IMAGE_REGISTRY:-smartupcms}/control-plane:${APP_VERSION:-1.0.0}
    container_name: ${PROJECT_NAME:-SmartupCMS}-control-plane
    restart: unless-stopped
    logging: *default-logging
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -Duser.timezone=UTC"
      DB_URL: jdbc:postgresql://db-cp:5432/${CP_DB_NAME:-dwh_control_plane}
      DB_USER: ${CP_DB_USER}
      DB_PASSWORD: ${CP_DB_PASSWORD}
      DWH_CP_ADMIN_LOGIN: ${CP_ADMIN_LOGIN:-cpadmin}
      DWH_CP_ADMIN_PASSWORD: ${CP_ADMIN_PASSWORD}
      MANAGEMENT_PORT: "9091"
      TZ: UTC
    depends_on:
      db-cp: { condition: service_healthy }
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9091/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s

  web-cp:
    image: ${IMAGE_REGISTRY:-smartupcms}/web-cp:${APP_VERSION:-1.0.0}
    container_name: ${PROJECT_NAME:-SmartupCMS}-web-cp
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal-net

volumes:
  db-data:
  db-cp-data:
  app-storage:
  typesense-data:

networks:
  internal-net:
    driver: bridge
