# ==============================================================================
# Smartup DWH / CMS Production Fleet & Multi-tenant Stack Orchestration
# ==============================================================================
name: ${PROJECT_NAME:-SmartupCMS}-fleet-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-app-common: &app-common
  image: ${IMAGE_REGISTRY:-smartupcms}/instance:${APP_VERSION:?APP_VERSION must be an immutable release tag}
  restart: unless-stopped
  logging: *default-logging
  environment:
    JAVA_TOOL_OPTIONS: "-Xms512m -Xmx2048m -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -Duser.timezone=UTC"
    DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-dwh_instance}
    DB_USER: ${DB_USER:?DB_USER is required}
    DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    DWH_INSTANCE_CLIENT_CODE: ${CLIENT_CODE:?CLIENT_CODE is required}
    DWH_INSTANCE_CLIENT_NAME: ${CLIENT_NAME:?CLIENT_NAME is required}
    DWH_INSTANCE_RESOURCE_PROFILE: ${RESOURCE_PROFILE:-M}
    DWH_INSTANCE_ADMIN_LOGIN: ${DWH_INSTANCE_ADMIN_LOGIN:-admin}
    DWH_INSTANCE_ADMIN_EMAIL: ${DWH_INSTANCE_ADMIN_EMAIL:-}
    DWH_INSTANCE_ADMIN_PASSWORD: ${DWH_INSTANCE_ADMIN_PASSWORD:?DWH_INSTANCE_ADMIN_PASSWORD is required for initial bootstrap}
    DWH_CP_URL: ${DWH_CP_URL:-http://control-plane:8081}
    DWH_CP_HEARTBEAT_TOKEN: ${DWH_CP_HEARTBEAT_TOKEN}
    DWH_TYPESENSE_URL: http://typesense:8108
    DWH_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
    DWH_TYPESENSE_ENABLED: "true"
    MANAGEMENT_PORT: "9090"
    TZ: UTC
  networks:
    - internal-net

services:
  proxy:
    build:
      context: ../..
      dockerfile: deploy/images/nginx-proxy/Dockerfile
    image: ${PROXY_IMAGE:-smartupcms/nginx-proxy:1.28-alpine-hardened}
    container_name: ${PROJECT_NAME:-SmartupCMS}-proxy
    restart: unless-stopped
    logging: *default-logging
    ports:
      # TLS terminates on a host reverse proxy. This container intentionally
      # exposes plain HTTP only on loopback; it has no certificate material.
      - "${PROXY_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:8080"
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - control-plane
      - web
      - web-cp
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  db:
    build:
      context: ../..
      dockerfile: deploy/images/postgres/Dockerfile
    image: ${POSTGRES_IMAGE:-smartupcms/postgres:18-alpine-hardened}
    container_name: ${PROJECT_NAME:-SmartupCMS}-db
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-dwh_instance}
      POSTGRES_USER: ${DB_USER:?DB_USER is required}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db-data:/var/lib/postgresql
      - ./backups:/backups
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER is required} -d ${DB_NAME:-dwh_instance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4096M

  migrate:
    <<: *app-common
    container_name: ${PROJECT_NAME:-SmartupCMS}-migrate
    profiles: [tools]
    command: ["--spring.profiles.active=migrate"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }

  app:
    <<: *app-common
    container_name: ${PROJECT_NAME:-SmartupCMS}-app
    command: ["--spring.profiles.active=prod"]
    volumes:
      - app-storage:/var/lib/dwh/storage
    depends_on:
      db: { condition: service_healthy }
      typesense: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 3072M

  web:
    image: ${IMAGE_REGISTRY:-smartupcms}/web:${APP_VERSION:?APP_VERSION must be an immutable release tag}
    container_name: ${PROJECT_NAME:-SmartupCMS}-web
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  typesense:
    build:
      context: ../..
      dockerfile: deploy/images/typesense/Dockerfile
    image: ${TYPESENSE_IMAGE:-smartupcms/typesense:27.1-hardened}
    container_name: ${PROJECT_NAME:-SmartupCMS}-typesense
    restart: unless-stopped
    logging: *default-logging
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "false"
    volumes:
      - typesense-data:/data
    networks:
      - internal-net
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8108;
          printf "GET /health HTTP/1.0\r\n\r\n" >&3;
          head -n 1 <&3 | grep -q " 200 "'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-cp:
    build:
      context: ../..
      dockerfile: deploy/images/postgres/Dockerfile
    image: ${POSTGRES_IMAGE:-smartupcms/postgres:18-alpine-hardened}
    container_name: ${PROJECT_NAME:-SmartupCMS}-db-cp
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${CP_DB_NAME:-dwh_control_plane}
      POSTGRES_USER: ${CP_DB_USER:?CP_DB_USER is required}
      POSTGRES_PASSWORD: ${CP_DB_PASSWORD:?CP_DB_PASSWORD is required}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - db-cp-data:/var/lib/postgresql
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CP_DB_USER:?CP_DB_USER is required} -d ${CP_DB_NAME:-dwh_control_plane}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate-cp:
    image: ${IMAGE_REGISTRY:-smartupcms}/control-plane:${APP_VERSION:?APP_VERSION must be an immutable release tag}
    container_name: ${PROJECT_NAME:-SmartupCMS}-migrate-cp
    profiles: [tools]
    command: ["--spring.profiles.active=migrate"]
    restart: "no"
    environment:
      DB_URL: jdbc:postgresql://db-cp:5432/${CP_DB_NAME:-dwh_control_plane}
      DB_USER: ${CP_DB_USER:?CP_DB_USER is required}
      DB_PASSWORD: ${CP_DB_PASSWORD:?CP_DB_PASSWORD is required}
    depends_on:
      db-cp: { condition: service_healthy }
    networks:
      - internal-net

  control-plane:
    image: ${IMAGE_REGISTRY:-smartupcms}/control-plane:${APP_VERSION:?APP_VERSION must be an immutable release tag}
    container_name: ${PROJECT_NAME:-SmartupCMS}-control-plane
    restart: unless-stopped
    logging: *default-logging
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -Duser.timezone=UTC"
      DB_URL: jdbc:postgresql://db-cp:5432/${CP_DB_NAME:-dwh_control_plane}
      DB_USER: ${CP_DB_USER:?CP_DB_USER is required}
      DB_PASSWORD: ${CP_DB_PASSWORD:?CP_DB_PASSWORD is required}
      DWH_CP_ADMIN_LOGIN: ${CP_ADMIN_LOGIN:-cpadmin}
      DWH_CP_ADMIN_PASSWORD: ${CP_ADMIN_PASSWORD:?CP_ADMIN_PASSWORD is required for initial bootstrap}
      MANAGEMENT_PORT: "9091"
      TZ: UTC
    depends_on:
      db-cp: { condition: service_healthy }
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9091/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 30s

  web-cp:
    image: ${IMAGE_REGISTRY:-smartupcms}/web-cp:${APP_VERSION:?APP_VERSION must be an immutable release tag}
    container_name: ${PROJECT_NAME:-SmartupCMS}-web-cp
    restart: unless-stopped
    logging: *default-logging
    networks:
      - internal-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  db-data:
  db-cp-data:
  app-storage:
  typesense-data:

networks:
  internal-net:
    driver: bridge
