modules:
  https_api:
    prober: http
    timeout: 8s
    http:
      method: GET
      valid_status_codes: [200]
      preferred_ip_protocol: ip4
      follow_redirects: false
      fail_if_not_ssl: true
      fail_if_header_not_matches:
        - header: Content-Type
          regexp: 'application/json'
      tls_config:
        min_version: TLS12
        insecure_skip_verify: false
