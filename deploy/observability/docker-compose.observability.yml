# Optional host and PostgreSQL exporters (ADR-0009, section 4; docs/ops/slo.md, section 7). Off by default: the
# production file alone never starts them. An operator who runs Prometheus adds this overlay:
#
#   docker compose -f deploy/compose/docker-compose.prod.yml \
#     -f deploy/observability/docker-compose.observability.yml --env-file <env> up -d
#
# Both exporters and the server join the internal network "monitoring" (<project>_monitoring); the operator's
# Prometheus joins that network and scrapes server:9090, node-exporter:9100 and postgres-exporter:9187
# (deploy/observability/prometheus/prometheus.yml). No port is published on the host.
#
# postgres-exporter signs in as a least-privilege monitoring role (member of pg_monitor, nothing else). The role is
# created once by the operator (SQL in docs/ops/slo.md, section 7); its password comes from the secret file
# MONITOR_DB_PASSWORD_FILE, never from the environment.
services:
  server:
    networks: [monitoring]

  node-exporter:
    image: prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: unless-stopped
    # The host's file systems, disks, memory, load and CPU only: no network, process or systemd collectors.
    command:
      - --path.rootfs=/host/root
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.disable-defaults
      - --collector.filesystem
      - --collector.diskstats
      - --collector.meminfo
      - --collector.loadavg
      - --collector.cpu
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|var/lib/docker/.+|var/lib/containers/.+)($$|/)
      - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tmpfs|tracefs)$$
      - --web.listen-address=:9100
      - --web.disable-exporter-metrics
    # Without mount propagation (rslave fails where / is a private mount, as on Docker Desktop): a file system
    # mounted on the host after the exporter started appears after its restart.
    volumes:
      - /:/host/root:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [monitoring]
    user: "65534:65534"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5", compress: "true"}

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e
    restart: unless-stopped
    environment:
      # The address and the role name only; the password is read from the secret file.
      DATA_SOURCE_URI: postgres:5432/${DB_NAME:-smartupcms}?sslmode=disable
      DATA_SOURCE_USER: ${MONITOR_DB_USER:-smartupcms_monitor}
      DATA_SOURCE_PASS_FILE: /run/secrets/monitor_database_password
    command: [--web.listen-address=:9187]
    secrets:
      - monitor_database_password
    networks: [backend, monitoring]
    depends_on:
      postgres: {condition: service_healthy}
    user: "65534:65534"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
        reservations:
          memory: 16M
    logging:
      driver: json-file
      options: {max-size: "100m", max-file: "5", compress: "true"}

networks:
  monitoring:
    driver: bridge
    internal: true

secrets:
  monitor_database_password:
    file: ${MONITOR_DB_PASSWORD_FILE:?MONITOR_DB_PASSWORD_FILE is required with the observability overlay}
