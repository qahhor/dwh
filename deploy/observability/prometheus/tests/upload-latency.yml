rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml
evaluation_interval: 1m
tests:
  - name: slow successful uploads have a separate latency budget
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{application="smartupcms",uri="/api/v1/tasks",method="GET",le="0.3"}'
        values: '0+60x40'
      - series: 'http_server_requests_seconds_bucket{application="smartupcms",uri="/api/v1/tasks",method="GET",le="+Inf"}'
        values: '0+60x40'
      - series: 'http_server_requests_seconds_count{application="smartupcms",uri="/api/v1/tasks",method="GET",status="200"}'
        values: '0+60x40'
      - series: 'http_server_requests_seconds_bucket{application="smartupcms",uri="/api/v1/files/upload",method="POST",le="0.3"}'
        values: '0x40'
      - series: 'http_server_requests_seconds_bucket{application="smartupcms",uri="/api/v1/files/upload",method="POST",le="30.0"}'
        values: '0+60x40'
      - series: 'http_server_requests_seconds_bucket{application="smartupcms",uri="/api/v1/files/upload",method="POST",le="+Inf"}'
        values: '0+60x40'
      - series: 'http_server_requests_seconds_count{application="smartupcms",uri="/api/v1/files/upload",method="POST",status="201"}'
        values: '0+60x40'
    promql_expr_test:
      - expr: round(smc:api_latency_seconds:p95_5m, 0.001)
        eval_time: 5m
        exp_samples:
          - labels: '{application="smartupcms"}'
            value: 0.285
      - expr: smc:api_requests_within_300ms:ratio_rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="smc:api_requests_within_300ms:ratio_rate5m",application="smartupcms"}'
            value: 1
      - expr: round(smc:upload_latency_seconds:p95_5m, 0.001)
        eval_time: 5m
        exp_samples:
          - labels: '{application="smartupcms"}'
            value: 28.515
      - expr: round(smc:upload_latency_seconds:p99_5m, 0.001)
        eval_time: 5m
        exp_samples:
          - labels: '{application="smartupcms"}'
            value: 29.703
    alert_rule_test:
      - eval_time: 30m
        alertname: SmartupcmsApiLatencyP95High
        exp_alerts: []
      - eval_time: 30m
        alertname: SmartupcmsUploadLatencyP95High
        exp_alerts: []

  - name: a different method never borrows the upload latency budget
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_bucket{application="smartupcms",uri="/api/v1/files/upload",method="GET",le="30.0"}'
        values: '0+60x10'
      - series: 'http_server_requests_seconds_bucket{application="smartupcms",uri="/api/v1/files/upload",method="GET",le="+Inf"}'
        values: '0+60x10'
    promql_expr_test:
      - expr: round(smc:api_latency_seconds:p95_5m, 0.001)
        eval_time: 5m
        exp_samples:
          - labels: '{application="smartupcms"}'
            value: 28.5
      - expr: smc:upload_latency_seconds:p95_5m
        eval_time: 5m
        exp_samples: []

  - name: uploads still count towards API errors and availability
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{application="smartupcms",uri="/api/v1/tasks",method="GET",status="200"}'
        values: '0+60x10'
      - series: 'http_server_requests_seconds_count{application="smartupcms",uri="/api/v1/files/upload",method="POST",status="503"}'
        values: '0+60x10'
    promql_expr_test:
      - expr: smc:api_error_ratio:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="smc:api_error_ratio:rate5m",application="smartupcms"}'
            value: 0.5
      - expr: smc:api_requests:rate5m
        eval_time: 5m
        exp_samples:
          - labels: '{__name__="smc:api_requests:rate5m",application="smartupcms"}'
            value: 2

  - name: upload alerts fire above the approved boundaries
    interval: 1m
    input_series:
      - series: 'smc:upload_latency_seconds:p95_5m{application="slow"}'
        values: '31x40'
      - series: 'smc:upload_latency_seconds:p99_5m{application="slow"}'
        values: '61x40'
      - series: 'smc:upload_latency_seconds:p95_5m{application="boundary"}'
        values: '30x40'
      - series: 'smc:upload_latency_seconds:p99_5m{application="boundary"}'
        values: '60x40'
    alert_rule_test:
      - eval_time: 30m
        alertname: SmartupcmsUploadLatencyP95High
        exp_alerts:
          - exp_labels:
              application: slow
              severity: warning
            exp_annotations:
              summary: "Upload p95 latency above 30 s"
              description: "The 95th percentile of POST /api/v1/files/upload has been 31s for 15 minutes (SLO 30 s)."
              runbook_url: "https://github.com/qahhor/dwh/blob/main/docs/runbooks/RB-02-api-errors-and-latency.md"
      - eval_time: 30m
        alertname: SmartupcmsUploadLatencyP99High
        exp_alerts:
          - exp_labels:
              application: slow
              severity: critical
            exp_annotations:
              summary: "Upload p99 latency above 60 s"
              description: "The 99th percentile of POST /api/v1/files/upload has been 1m 1s for 15 minutes (SLO 60 s)."
              runbook_url: "https://github.com/qahhor/dwh/blob/main/docs/runbooks/RB-02-api-errors-and-latency.md"
