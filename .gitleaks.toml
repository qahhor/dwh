title = "SmartupCMS gitleaks configuration"

[extend]
useDefault = true

# Personal API tokens of SmartupCMS: the prefix and 32 random bytes in unpadded base64url (KauthApiTokenService).
# Plan 10/10, item 4.7: new tokens start with smc_; tokens issued before it start with dwh_ and authenticate until
# 2026-12-31, so a leaked token of either prefix is still a live secret.
[[rules]]
id = "smartupcms-api-token"
description = "SmartupCMS personal API token"
regex = '''\b((?:smc|dwh)_[A-Za-z0-9_-]{43})(?:[^A-Za-z0-9_-]|$)'''
secretGroup = 1
entropy = 3.5
keywords = ["smc_", "dwh_"]

[[allowlists]]
description = "Graphify stat index stores only generated SHA-256 content hashes"
paths = ['''(?:^|/)graphify-out/cache/stat-index\.json$''']

[[allowlists]]
description = "Maven target directories contain generated test reports and build artifacts"
paths = ['''(?:^|/)target/''']

[[allowlists]]
description = "S3 credentials are intentionally empty in environment templates"
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|/)(?:deploy/compose/)?\.env\.example$''']
regexes = ['''(?:DWH|SMC)_S3_(?:ACCESS|SECRET)_KEY=\s+(?:DWH|SMC)_S3_(?:SECRET_KEY|BUCKET)=''']

[[allowlists]]
description = "i18n translation catalogs contain UI labels referencing tokens, 2FA, and keys"
paths = ['''(?:^|/)apps/server/src/main/resources/i18n/.*\.json$''']

[[allowlists]]
description = "The map of renamed i18n keys (ADR-0031) pairs key names such as iam.profile.password.*, not secrets"
paths = ['''(?:^|/)apps/web/scripts/i18n-key-renames\.json$''']

[[allowlists]]
description = "A labelKey names an i18n catalog entry (dotted lower-case key such as iam.srok_30_dney), not a secret"
regexTarget = "match"
regexes = ['''labelKey: '[a-z0-9_]+(?:\.[a-z0-9_]+)+'$''']
