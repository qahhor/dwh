# Every commit of a branch carries a DCO sign-off (CONTRIBUTING.md, `git commit -s`).
# Started by hand only (owner decision 2026-10-17: no workflow runs automatically); the same check runs locally
# before a merge: `git log --format=%B main..HEAD`. Dispatch it on the branch to check.
name: DCO

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Branch the commits are counted from (the merge base with it)
        type: string
        default: main

permissions:
  contents: read

jobs:
  signed-off-commits:
    name: Verify commit sign-offs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Require a DCO trailer on every commit
        env:
          BASE_REF: ${{ inputs.base_ref }}
        shell: bash
        run: |
          set -euo pipefail
          base_sha=$(git merge-base "origin/${BASE_REF}" HEAD)
          mapfile -t commits < <(git rev-list --reverse "${base_sha}..HEAD")
          if (( ${#commits[@]} == 0 )); then
            echo "No commits after ${BASE_REF}: nothing to check."
            exit 0
          fi

          failed=0
          for commit in "${commits[@]}"; do
            # The policy is prospective: commits made before the repository
            # contained DCO are covered by the project relicensing statement.
            if ! git cat-file -e "${commit}^:DCO" 2>/dev/null; then
              echo "DCO policy not active for historical commit: ${commit}"
              continue
            fi

            if ! git show -s --format=%B "${commit}" \
              | grep -Eq '^Signed-off-by: .+ <[^<>[:space:]]+@[^<>[:space:]]+>$'; then
              echo "Missing valid Signed-off-by trailer: ${commit}" >&2
              failed=1
            fi
          done

          if (( failed != 0 )); then
            echo "Sign commits with: git commit -s" >&2
            echo "See DCO and CONTRIBUTING.md for remediation." >&2
            exit 1
          fi
