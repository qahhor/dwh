# Static analysis (plan 10/10, item 1.6): CodeQL reads the server (Java), the web application and the E2E suite
# (TypeScript), deployment/recovery automation (Python), and these workflows on every pull request, on main,
# and weekly for newly published queries.
# Findings land in Security -> Code scanning; the main ruleset requires this check with no high-severity alert.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # build-mode none: the sources are read without compiling them, so the analysis needs no JDK or npm install.
        language: [java-kotlin, javascript-typescript, python, actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          config: |
            paths-ignore:
              - '**/node_modules'
              - '**/dist'
              - '**/target'
              - apps/web/src/app/core/i18n/packaged-russian.ts

      - name: Analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
