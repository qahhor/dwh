# Nightly checks (plan 10/10, item 1.8): drills too slow or too broad for every pull request, and a fresh look at
# published advisories. Each job builds what it needs on a disposable runner; a red job is triaged the next morning.
# scripts/docs/test-repository-hygiene.ps1 fails when a scripts/**/test-* script is run by no workflow.
name: nightly

on:
  schedule:
    - cron: '30 22 * * *' # 03:30 in Tashkent
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  drills:
    name: release readiness drills (search, concurrency, capacity, contracts)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Runs the search, database concurrency and capacity drills and the repository contracts.
      - name: Final readiness drill
        shell: pwsh
        run: ./scripts/release/test-final-readiness.ps1

  cms-cli:
    name: cms CLI output builds and passes the gates (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'

      # Plan 10/10, item 6.1: the CLI creates a module, an entity with hooks and fields and a diff migration in a
      # temporary copy, then builds the server with them (Spotless, Error Prone, Checkstyle, the architecture and
      # migration tests, the entity contract kit, the schema comparison). Linux runs the Node runner itself, Windows
      # the PowerShell entry point that wraps it.
      - name: Generate with the CLI and build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          node --test 'tools/cms-cli/test/**/*.test.mjs'
          node tools/cms-cli/scripts/smoke.mjs

      - name: Generate with the CLI and build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/dev/test-cms-cli.ps1

  upgrade:
    name: upgrade drill (production Compose, backup at V018, migrate to the newest)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Back up a V018 installation and upgrade it
        shell: pwsh
        run: ./scripts/prod/test-v018-upgrade.ps1

  egress:
    name: no default egress drill
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Observe that the stack opens no outbound connection by default
        shell: pwsh
        run: ./scripts/security/test-no-default-egress.ps1

  api-smoke:
    name: live API smoke on a clean stack
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          instance_password="Nightly-$(openssl rand -hex 16)"
          echo "::add-mask::$instance_password"
          echo "ADMIN_PASSWORD=$instance_password" >> "$GITHUB_ENV"

      - name: Build, migrate and start the stack
        env:
          COMPOSE_FILE: docker-compose.yml:scripts/dev/api-smoke.compose.yml:scripts/dev/e2e-mail.compose.yml
          SMC_RATE_LIMIT_USER_PER_MINUTE: '6000'
        run: |
          docker compose build --pull
          docker compose run --rm migrate
          docker compose up -d --remove-orphans --wait --wait-timeout 180

      - name: Live API smoke
        shell: pwsh
        run: ./scripts/dev/test-api.ps1

      - name: Server log on failure
        if: failure()
        run: docker compose logs --no-color --tail 300 server

      - name: Clean the stack
        if: always()
        env:
          COMPOSE_FILE: docker-compose.yml:scripts/dev/api-smoke.compose.yml:scripts/dev/e2e-mail.compose.yml
        run: docker compose down --volumes --remove-orphans

  advisories:
    name: advisories published since the last change (Trivy)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve the backend SBOM
        run: |
          mvn -B -q -DskipTests package
          mvn -B -q org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json

      # The same scans as the security job of ci.yml; a new HIGH or CRITICAL advisory turns this job red within a
      # day, and it is closed within 7 days (docs/ops/repository-settings.md).
      - name: Trivy (backend SBOM)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.70.0
          scan-type: sbom
          scan-ref: target/bom.json
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy (web application and build dependencies)
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: apps/web
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy (E2E toolchain dependencies)
        if: always()
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: e2e
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
