# Arms GitHub auto-merge on one Dependabot patch update (plan 10/10, item 1.5).
# Off by default: no workflow runs automatically (owner decision 2026-10-17), so this one is started by hand with the
# pull request number. GitHub's auto-merge waits for the checks that the main ruleset requires; main requires none
# while the gates run locally (docs/ops/repository-settings.md), so the job refuses to arm it and a Dependabot pull
# request is merged by hand after the local gates.
name: dependabot auto-merge

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Number of the Dependabot pull request
        type: number
        required: true

permissions: {}

jobs:
  auto-merge:
    name: arm auto-merge for a patch update
    if: github.repository == 'qahhor/dwh'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Arm auto-merge (Dependabot, patch only, main must require checks)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ inputs.pull_request }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          author=$(gh pr view "$PR" --repo "$REPO" --json author --jq '.author.login')
          if [ "$author" != "app/dependabot" ] && [ "$author" != "dependabot[bot]" ]; then
            echo "::error::Pull request $PR is not a Dependabot update (author: $author)."
            exit 1
          fi
          # Dependabot writes the update type of every dependency into its commit message.
          types=$(gh pr view "$PR" --repo "$REPO" --json commits --jq '.commits[].messageBody' \
            | sed -n 's/^ *update-type: *//p' | sort -u)
          if [ "$types" != "version-update:semver-patch" ]; then
            echo "::notice::Pull request $PR is not a patch-only update (${types:-no update type}): it waits for review."
            exit 0
          fi
          required=$(gh api "repos/$REPO/rules/branches/main" --jq '[.[] | select(.type == "required_status_checks")] | length')
          if [ "$required" = "0" ]; then
            echo "::warning::main requires no status checks: auto-merge would skip the gates, so it stays off. Merge by hand after the local gates."
            exit 0
          fi
          gh pr merge --auto --merge "$PR" --repo "$REPO"
