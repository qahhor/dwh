# OpenSSF Scorecard (plan 10/10, item 1.6): supply-chain practices of the repository — pinned dependencies, token
# permissions, branch protection, code review, SAST, dangerous workflows. Results land in Security -> Code scanning
# and on the public Scorecard page; the target is 7.5 at the end of phase 1 and 8 at the end of the plan.
# Started by hand on the default branch only (owner decision 2026-10-17: no workflow runs automatically).
name: scorecard

on:
  workflow_dispatch:

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # Upload of the results to Code scanning.
      security-events: write
      # Publication of the results, signed with the workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
