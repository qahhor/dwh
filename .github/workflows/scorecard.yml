# OpenSSF Scorecard (plan 10/10, item 1.6): supply-chain practices of the repository — pinned dependencies, token
# permissions, branch protection, code review, SAST, dangerous workflows. Results land in Security -> Code scanning
# and on the public Scorecard page; the target is 7.5 at the end of phase 1 and 8 at the end of the plan.
name: scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: '41 4 * * 1'

permissions: {}

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      # Upload of the results to Code scanning.
      security-events: write
      # Publication of the results, signed with the workflow's OIDC identity.
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: scorecard.sarif
