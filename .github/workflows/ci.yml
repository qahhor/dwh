# CI gates: backend, frontend, production config, E2E and security.
# A red required job must block merge in GitHub branch protection.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (mvn verify + ArchUnit + SBOM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build & test
        run: mvn -B verify

      - name: SBOM (CycloneDX)
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json

      - name: Upload SBOM
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error

  frontend:
    name: frontend (unit + typecheck + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web application
        working-directory: apps/web
        run: npm ci

      - name: Validate design token contrast contract
        working-directory: apps/web
        run: npm run contrast:audit

      - name: Validate that the web origin serves its own assets
        working-directory: apps/web
        run: |
          if grep -rnE 'https?://(fonts\.(googleapis|gstatic)\.com|cdn\.|unpkg\.com|cdnjs\.)' src/; then
            echo "::error::The application must not fetch assets from a third party: an installation may run in a closed network, and a CDN discloses every viewer's address. Ship the asset from src/assets instead (ADR-0012)."
            exit 1
          fi

      - name: Validate that named elements have a role that takes a name
        working-directory: apps/web
        run: npm run aria:audit

      - name: Validate localization contract
        working-directory: apps/web
        run: |
          npm run i18n:sync-ru
          if ! git diff --quiet -- src/app/core/i18n/packaged-russian.ts; then
            echo "::error::packaged-russian.ts is out of sync with ru.json. Run 'npm run i18n:sync-ru' and commit the result."
            git --no-pager diff -- src/app/core/i18n/packaged-russian.ts | head -40
            exit 1
          fi
          npm run i18n:audit

      - name: Validate Angular class member order
        working-directory: apps/web
        run: npm run signals:audit

      - name: Test with coverage, typecheck & build web application
        working-directory: apps/web
        run: |
          npm run test:coverage
          npm run typecheck
          npm run build

      # The coverage table lands in the job summary of every pull request; the
      # step fails when coverage drops under the floor in coverage-summary.mjs.
      - name: Report web coverage
        working-directory: apps/web
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"

      # Axe (WCAG 2.1 A/AA) on the rebuilt screens in both themes, against the
      # production build with a mocked API: no backend, database or Docker.
      - name: Check accessibility of key screens
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:a11y

      - name: Upload accessibility failure screenshots
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: a11y-failure-artifacts
          path: e2e/test-results/a11y
          if-no-files-found: ignore
          retention-days: 7

  release-config:
    name: release config (Compose + NGINX + fail-closed deploy)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Validate unified architecture boundary
        shell: pwsh
        run: ./scripts/architecture/test-unified-boundaries.ps1

      - name: Validate public documentation contract
        shell: pwsh
        run: ./scripts/docs/test-public-docs.ps1

      - name: Validate repository hygiene contract
        shell: pwsh
        run: ./scripts/docs/test-repository-hygiene.ps1

      - name: Validate release supply-chain contract
        shell: pwsh
        run: ./scripts/release/verify-release.ps1

      - name: Validate production Compose, proxy and scripts
        shell: pwsh
        run: ./scripts/prod/test-release-config.ps1

      - name: Validate encrypted backup status contract
        shell: pwsh
        run: ./scripts/prod/test-backup-status.ps1

      - name: Validate managed infrastructure acceptance contract
        shell: pwsh
        run: ./scripts/acceptance/test-managed-acceptance.ps1

      - name: Verify backup failure blocks migrations
        run: bash scripts/prod/test-deploy-fail-closed.sh

      - name: Verify backup and restore of both databases
        run: bash scripts/prod/test-backup-databases.sh

  e2e:
    name: e2e (clean deploy + Playwright Chromium)
    runs-on: ubuntu-24.04
    needs: [backend, frontend, release-config]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          instance_password="CiA1-$(openssl rand -hex 16)"
          echo "::add-mask::$instance_password"
          echo "ADMIN_PASSWORD=$instance_password" >> "$GITHUB_ENV"

      - name: Validate PowerShell dotenv parser
        shell: pwsh
        run: ./scripts/dev/test-dotenv-parser.ps1

      - name: Build clean Compose images
        run: docker compose --profile backup build --pull

      - name: Scan runtime images
        shell: pwsh
        run: ./scripts/security/scan-runtime-images.ps1

      - name: Migrate empty databases
        run: docker compose run --rm migrate

      - name: Start stack and wait for health
        # One administrator drives the whole serial suite, about a test a
        # second, so the default budget of 600 requests a minute per user runs
        # out part-way and later specs get 429 from ordinary reads. This stack
        # is disposable; the stricter budgets for search and audit paths stay.
        env:
          DWH_RATE_LIMIT_USER_PER_MINUTE: '6000'
        run: docker compose up -d --remove-orphans --wait --wait-timeout 180

      - name: Smoke public endpoints
        run: |
          curl --fail --silent --show-error http://localhost:4200/healthz
          curl --fail --silent --show-error http://localhost:4200/

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser E2E suite
        working-directory: e2e
        run: |
          npm run test:config
          npm run typecheck
          npm run test:artifact-security
          # The suite runs on the stack's second origin (4201, published by
          # docker-compose.yml): specs that create synthetic fixtures refuse
          # the default installation's 4200, and this stack is disposable —
          # its volumes are removed when the job ends.
          INSTANCE_BASE_URL=http://localhost:4201 npm test

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-failure-artifacts
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean isolated Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    name: security (gitleaks + trivy)
    runs-on: ubuntu-24.04
    needs: backend
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Download resolved backend SBOM
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: sbom
          path: security-input/backend-sbom

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.28.0
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_IGNORE_PATH: .gitleaksignore

      - name: Trivy (resolved backend SBOM)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.70.0
          scan-type: sbom
          scan-ref: security-input/backend-sbom/bom.json
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy (web application and build dependencies)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: apps/web
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      - name: Trivy (E2E toolchain dependencies)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_INCLUDE_DEV_DEPS: 'true'
        with:
          version: v0.70.0
          scan-type: fs
          scan-ref: e2e
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
