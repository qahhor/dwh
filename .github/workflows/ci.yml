# CI-гейты (R5, ремедиация): сборка + тесты + ArchUnit + SBOM + сканы.
# Правила блокировки (FR-SEC-4, FR-MOD-2): красный джоб = merge запрещён.
# Ветки защищаются в настройках GitHub (required checks: backend, frontend, e2e, security).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (mvn verify + ArchUnit + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Тесты включают Testcontainers (PostgreSQL 18) — Docker есть на раннере.
      # ArchUnit-тесты границ модулей падают -> сборка красная (FR-MOD-2).
      - name: Build & test
        run: mvn -B verify

      - name: SBOM (CycloneDX)
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error

  frontend:
    name: frontend (web-instance + web-cp build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web-instance/package-lock.json
            apps/web-cp/package-lock.json

      - name: Install & Build Web Instance
        run: |
          cd apps/web-instance
          npm ci
          npm run build

      - name: Install & Build Web Control Plane
        run: |
          cd apps/web-cp
          npm ci
          npm run build

  e2e:
    name: e2e (clean deploy + Playwright Chromium)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          instance_password="CiA1-$(openssl rand -hex 16)"
          cp_password="CiCpA1-$(openssl rand -hex 16)"
          echo "::add-mask::$instance_password"
          echo "::add-mask::$cp_password"
          {
            echo "ADMIN_PASSWORD=$instance_password"
            echo "CP_ADMIN_LOGIN=cpadmin"
            echo "CP_ADMIN_PASSWORD=$cp_password"
          } >> "$GITHUB_ENV"

      - name: Validate PowerShell dotenv parser
        shell: pwsh
        run: ./scripts/dev/test-dotenv-parser.ps1

      - name: Build clean Compose images
        run: docker compose build --pull

      - name: Migrate empty databases
        run: |
          docker compose run --rm migrate
          docker compose run --rm migrate-cp

      - name: Start stack and wait for health
        shell: bash
        run: |
          docker compose up -d --remove-orphans
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors http://localhost:9190/actuator/health
          curl --fail --silent --show-error --retry 60 --retry-delay 2 --retry-all-errors http://localhost:9191/actuator/health
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:4200/
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://localhost:4300/

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser E2E suite
        working-directory: e2e
        run: |
          npm run test:config
          npm run typecheck
          npm run test:artifact-security
          npm test

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean isolated Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    name: security (gitleaks + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks сканирует историю

      # FR-SEC-3: секретов в репозитории нет — любой найденный блокирует merge
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # FR-SEC-4: Critical/High уязвимости зависимостей блокируют merge.
      # Исключения — только через .trivyignore с обоснованием и сроком (ревью обязательно).
      - name: Trivy (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
