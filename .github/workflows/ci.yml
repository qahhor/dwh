# CI gates: backend, frontend, production config, E2E and security.
# A red required job must block merge in GitHub branch protection.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: backend (mvn verify + ArchUnit + SBOM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build & test
        run: mvn -B verify

      - name: SBOM (CycloneDX)
        run: mvn -B org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DoutputFormat=json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: target/bom.json
          if-no-files-found: error

  frontend:
    name: frontend (unit + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: apps/web-instance/package-lock.json

      - name: Install Web Instance
        working-directory: apps/web-instance
        run: npm ci

      - name: Test, typecheck & build Web Instance
        working-directory: apps/web-instance
        run: |
          npm test
          npm run typecheck
          npm run build

  release-config:
    name: release config (Compose + NGINX + fail-closed deploy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate unified architecture boundary
        shell: pwsh
        run: ./scripts/architecture/test-unified-boundaries.ps1

      - name: Validate production Compose, proxy and scripts
        shell: pwsh
        run: ./scripts/prod/test-release-config.ps1

      - name: Verify backup failure blocks migrations
        run: bash scripts/prod/test-deploy-fail-closed.sh

  e2e:
    name: e2e (clean deploy + Playwright Chromium)
    runs-on: ubuntu-latest
    needs: [backend, frontend, release-config]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Generate ephemeral test credentials
        shell: bash
        run: |
          instance_password="CiA1-$(openssl rand -hex 16)"
          echo "::add-mask::$instance_password"
          echo "ADMIN_PASSWORD=$instance_password" >> "$GITHUB_ENV"

      - name: Validate PowerShell dotenv parser
        shell: pwsh
        run: ./scripts/dev/test-dotenv-parser.ps1

      - name: Build clean Compose images
        run: docker compose build --pull

      - name: Build hardened production proxy image
        run: docker build --pull -f deploy/images/nginx-proxy/Dockerfile -t smartupcms/nginx-proxy:1.28-alpine-hardened .

      - name: Scan runtime images
        shell: pwsh
        run: ./scripts/security/scan-runtime-images.ps1

      - name: Migrate empty databases
        run: docker compose run --rm migrate

      - name: Start stack and wait for health
        run: docker compose up -d --remove-orphans --wait --wait-timeout 180

      - name: Smoke public endpoints
        run: |
          curl --fail --silent --show-error http://localhost:9190/actuator/health
          curl --fail --silent --show-error http://localhost:4200/

      - name: Install E2E dependencies
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run browser E2E suite
        working-directory: e2e
        run: |
          npm run test:config
          npm run typecheck
          npm run test:artifact-security
          npm test

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean isolated Compose resources
        if: always()
        run: docker compose down --volumes --remove-orphans

  security:
    name: security (gitleaks + trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.28.0

      - name: Trivy (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
