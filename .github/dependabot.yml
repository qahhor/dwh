# Dependency updates (plan 10/10, item 1.5): Maven, npm, GitHub Actions and Docker base images, weekly and grouped
# so that a week brings a few pull requests, not dozens. Security updates come on top of these, as soon as an
# advisory appears (the repository setting "Dependabot security updates"). Patch updates merge by themselves when
# the required checks pass (.github/workflows/dependabot-auto-merge.yml); minor and major ones wait for review.
version: 2

updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
    groups:
      spring:
        patterns: ["org.springframework*"]
      build-plugins:
        patterns:
          - "org.apache.maven.plugins:*"
          - "org.jacoco:*"
          - "com.diffplug.spotless:*"
          - "com.palantir.javaformat:*"
          - "com.puppycrawl.tools:*"
          - "com.google.errorprone:*"
          - "com.uber.nullaway:*"
      test:
        patterns:
          - "org.testcontainers:*"
          - "com.tngtech.archunit:*"
          - "io.zonky.test*"
      patch:
        update-types: [patch]

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 10
    commit-message:
      prefix: build(deps)
    groups:
      # Angular's packages require each other at the exact same version: one of them alone cannot resolve.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/angular", "angular-eslint", "@angular-eslint/*"]
      vitest:
        patterns: ["vitest", "@vitest/*"]
      lint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "stylelint*", "prettier"]
      patch:
        update-types: [patch]
    ignore:
      # Angular declares the TypeScript range it compiles with (22.x: >=6.0 <6.1): a new major waits for Angular.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
    groups:
      playwright:
        patterns: ["@playwright/*", "playwright*", "@axe-core/*", "axe-core"]
      patch:
        update-types: [patch]
    ignore:
      # The types follow the Node the suite runs on (.node-version, an LTS line), not the newest Node.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # Generator of the web's API types (plan 10/10, item 3.3).
  - package-ecosystem: npm
    directory: /tools/api-types
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    open-pull-requests-limit: 3
    commit-message:
      prefix: build(deps)
    ignore:
      # openapi-typescript 7 declares TypeScript ^5: a new major waits for the generator.
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ["*"]
    # scripts/release/verify-release.ps1 approves exact commits of these (Node 24 releases, the Trivy action);
    # they are raised by hand together with that contract.
    ignore:
      - dependency-name: actions/checkout
      - dependency-name: actions/setup-node
      - dependency-name: actions/setup-java
      - dependency-name: actions/upload-artifact
      - dependency-name: actions/download-artifact
      - dependency-name: aquasecurity/trivy-action

  - package-ecosystem: docker
    directories:
      - /
      - /apps/web
      - /deploy/images/backup
      - /deploy/images/nginx-proxy
      - /deploy/images/postgres
      - /deploy/images/typesense
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Tashkent
    commit-message:
      prefix: build(deps)
    groups:
      base-images:
        update-types: [minor, patch]
    ignore:
      # The build image is pinned to Java 25 by its tag (3.9-eclipse-temurin-25); Dependabot read
      # 3-eclipse-temurin-24 as newer. Only its digest moves.
      - dependency-name: maven
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      # nginx: the even minor is the stable line (1.28); the odd one is mainline.
      - dependency-name: nginx
        update-types: [version-update:semver-minor]
      # Node: the LTS line of .node-version; a new major waits for its LTS.
      - dependency-name: node
        update-types: [version-update:semver-major]
