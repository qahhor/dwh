server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: dwh-instance
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dwh_instance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: InstanceHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    # NFR-10 / ADR-0007 2.3: приложение НЕ мигрирует схему. Миграции — только
    # отдельным запуском: --spring.profiles.active=migrate (batch-job фазы P).
    # При старте приложение лишь проверяет схему (SchemaVersionGate, FR-INST-2).
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    # Jackson 3: даты ISO-8601 по умолчанию, write-dates-as-timestamps удалён
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

dwh:
  rate-limit:
    enabled: true
    ip-per-minute: 60        # неаутентифицированные, по IP
    user-per-minute: 600     # cookie-сессии
    token-per-minute: 300    # Bearer, на владельца токена
    expensive-per-minute: 10 # дорогие операции (пути ниже)
    expensive-paths:
      - /api/v1/audit/**
      - /api/v1/search/**

logging:
  pattern:
    level: "%5p [traceparent=%X{traceparent}] [client=%X{client_code}]"
