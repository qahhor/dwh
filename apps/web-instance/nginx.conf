# Раздача SPA и проксирование API на бэкенд той же compose-группы.
server {
    # 8080 вместо 80: контейнер работает под non-root, порты <1024 недоступны
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Проверка живости самого nginx — не зависит от бэкенда
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # API и поток событий — на бэкенд. Имя app резолвится в сети compose.
    location /api/ {
        # Встроенный DNS Docker + переменная в proxy_pass = резолвинг на каждый
        # запрос. Без этого nginx кэширует IP бэкенда со старта и после его
        # пересоздания (любое обновление версии) отдаёт 502, пока сам не будет
        # перезапущен.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_app app:8080;
        proxy_pass http://$upstream_app$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE (FR-NOTIF-2): буферизация убила бы поток событий,
        # а короткий таймаут рвал бы соединение между heartbeat'ами.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты с хешем в имени можно кэшировать надолго
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
