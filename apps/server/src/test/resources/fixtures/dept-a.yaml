# Instance configuration "department A". Test resource only: src/main holds no such data.
# Codes and names are synthetic: the core must work with any set of units and sources a buyer has.
name: dept-a
units:
  # the first unit is the base (refers to itself), the second is derived from it, the third is a separate base
  - code: u_test_b
    name_uz: Bazaviy birlik TEST
    base: u_test_b
  - code: u_test_a
    name_uz: Birlik A TEST
    base: u_test_b
  - code: u_test_c
    name_uz: Birlik C TEST
    base: u_test_c
coefficients:
  # one "derived -> base" pair, two dated values
  - from: u_test_a
    to: u_test_b
    factor: 1000
    valid_from: 2026-01-01
  - from: u_test_a
    to: u_test_b
    factor: 1200
    valid_from: 2026-07-01
loads:
  # first: the main load (source + period); second: another source, same period; third: same source, other period
  - source: src_test
    period_from: 2026-01-01
    period_to: 2026-01-31
    format: v1
  - source: src_test_2
    period_from: 2026-01-01
    period_to: 2026-01-31
    format: v1
  - source: src_test
    period_from: 2026-02-01
    period_to: 2026-02-28
    format: v1
# profile of client A's tax file: 3 title rows above the header, the header in row 4, a totals row; TEST values
formats:
  - code: fmt.a.tax
    name: Soliq tushumlari TEST
    owner_org: Tashkilot A TEST
    periodicity: month
    sla_days: 15
    file_kind: xlsx
    match_columns_by: header
    valid_from: 2026-01-01
    sheets:
      - sheet_name: Солиқ
        header_row: 4
        total_row_marker: Жами
        columns:
          - {name: "Т/р", field: row_no, type: integer, required: false}
          - {name: "СТИР", field: object_key, type: object_key, required: true, key_mask: "^[0-9]{9}$", key_pad_length: 9, key_pad_max: 1}
          - {name: "Корхона номи", field: org_name, type: text, required: true}
          - {name: "Ҳудуд", field: region, type: ref_code, required: true, ref_book: region}
          - {name: "Ҳисобланган солиқ (млн сўм)", field: tax_accrued, type: number, required: true, source_unit: u_test_a, base_unit: u_test_b}
          - {name: "Тўланган солиқ (минг сўм)", field: tax_paid, type: number, required: false, source_unit: u_test_b, base_unit: u_test_b}
