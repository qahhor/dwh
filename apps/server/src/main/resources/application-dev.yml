# Local development ONLY (--spring.profiles.active=dev).
# In a production deployment these values come from the job configuration (later from Vault).
smc:
  public-url: http://localhost:4200
  delivery:
    enforce: false
  audit:
    archive:
      local-path: ${java.io.tmpdir}/smartupcms-audit-archive

dwh:
  schema-gate:
    enabled: true
  instance:
    client-code: dev-local
    client-name: Local Development
    resource-profile: S
    admin-login: admin
    admin-email: admin@dev.local
    admin-password: DevOnly-ChangeMe-1  # force_password_change=true on first sign-in
