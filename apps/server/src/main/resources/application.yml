server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: smartupcms-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dwh_instance}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: SmartupCmsHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  flyway:
    # NFR-10 / ADR-0007 2.3: приложение НЕ мигрирует схему. Миграции — только
    # отдельным запуском: --spring.profiles.active=migrate (batch-job фазы P).
    # При старте приложение лишь проверяет схему (SchemaVersionGate, FR-INST-2).
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    # FR-NOTIF-3. Пусто -> SmtpMailProvider не поднимается и активной остаётся
    # заглушка: канал восстановления пароля работать не будет, и об этом
    # предупредит NotificationChannelStartupCheck при старте.
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      # Без таймаутов недоступный шлюз держит поток отправки до упора.
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jackson:
    # Jackson 3: даты ISO-8601 по умолчанию, write-dates-as-timestamps удалён
    default-property-inclusion: non_null
    deserialization:
      # Jackson 3 включил fail-on-null-for-primitives по умолчанию (в Jackson 2
      # было выключено). Из-за этого клиент, опустивший необязательное поле
      # с примитивным типом, получал 400. Контракт ТЗ-04: такие поля
      # необязательны и берут значение по умолчанию — возвращаем прежнее поведение.
      fail-on-null-for-primitives: false

management:
  server:
    # Actuator на отдельном порту: НЕ публикуется наружу (compose/Nomad),
    # доступен только сети мониторинга. Поэтому в SecurityConfig он permitAll.
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  health:
    mail:
      # Недоступность почтового шлюза не должна ронять экземпляр: healthcheck
      # контейнера читает этот же эндпоинт и перезапустил бы приложение.
      # Состояние канала показывает NotificationChannelStartupCheck и журнал.
      enabled: false

dwh:
  providers:
    # Активный провайдер каждого канала (ADR-0011). Значение console_* означает
    # заглушку: сообщения пишутся в журнал и никуда не уходят.
    storage: ${DWH_PROVIDER_STORAGE:local_disk}
    mail: ${DWH_PROVIDER_MAIL:console_mail}
    sms: ${DWH_PROVIDER_SMS:console_sms}
    messenger: ${DWH_PROVIDER_MESSENGER:console_messenger}
  mail:
    from: ${DWH_MAIL_FROM:no-reply@localhost}
    from-name: ${DWH_MAIL_FROM_NAME:SmartupCMS}
  telegram:
    # FR-NOTIF-4. Пусто -> TelegramBotMessengerProvider не поднимается.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-url: ${TELEGRAM_API_URL:https://api.telegram.org}
  audit:
    # Запас месячных партиций audit_log вперёд (FR-AUD-2). Партиция, не
    # созданная вовремя, — тупик: аудит уходит в default, откуда retention
    # его не отцепит, а создать нужную партицию задним числом PostgreSQL
    # уже не даст.
    partition-runway-months: ${DWH_AUDIT_PARTITION_RUNWAY:6}
    partition-cron: ${DWH_AUDIT_PARTITION_CRON:0 30 3 * * *}
    # Срок хранения оперативного журнала (FR-AUD-2). Партиции старше окна
    # отцепляются и переименовываются в audit_log_archived_YYYY_MM — данные
    # остаются в базе, решение об их судьбе принимает эксплуатация.
    # 0 — не отцеплять ничего.
    retention-months: ${DWH_AUDIT_RETENTION_MONTHS:12}
  backup:
    # Status is written atomically by the local backup command/sidecar.
    status-file: ${DWH_BACKUP_STATUS_FILE:/var/lib/smartupcms/backup/status.json}
  webhooks:
    # Outbound webhooks are a deliberate egress boundary. The default install
    # is fail-closed; enabling requires an exact, comma-separated host allow-list.
    enabled: ${DWH_WEBHOOKS_ENABLED:false}
    allowed-hosts: ${DWH_WEBHOOKS_ALLOWED_HOSTS:}
    # Client-owned installations may explicitly allow an internal destination.
    # Keep false for internet-facing and Smartup-managed installations.
    allow-private-addresses: ${DWH_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES:false}
    connect-timeout: ${DWH_WEBHOOKS_CONNECT_TIMEOUT:3s}
    read-timeout: ${DWH_WEBHOOKS_READ_TIMEOUT:10s}
  storage:
    local-path: ${DWH_STORAGE_LOCAL_PATH:./data/storage}
    s3:
      endpoint: ${DWH_S3_ENDPOINT:}
      region: ${DWH_S3_REGION:auto}
      access-key: ${DWH_S3_ACCESS_KEY:}
      secret-key: ${DWH_S3_SECRET_KEY:}
      bucket: ${DWH_S3_BUCKET:}
      path-style-access: ${DWH_S3_PATH_STYLE:true}
      connect-timeout: ${DWH_S3_CONNECT_TIMEOUT:5s}
      read-timeout: ${DWH_S3_READ_TIMEOUT:30s}
  sse:
    timeout-ms: 1800000            # 30 мин; EventSource переподключается сам
    heartbeat-ms: 25000            # keep-alive < таймаута прокси (обычно 60 с)
    max-connections-per-user: 5    # защита от утечки вкладок на клиенте
  rate-limit:
    enabled: true
    ip-per-minute: 60        # неаутентифицированные, по IP
    user-per-minute: 600     # cookie-сессии
    token-per-minute: 300    # Bearer, на владельца токена
    expensive-per-minute: 10 # дорогие операции (пути ниже)
    expensive-paths:
      - /api/v1/audit/**
      - /api/v1/search/**
  typesense:
    url: ${DWH_TYPESENSE_URL:http://typesense:8108}
    api-key: ${DWH_TYPESENSE_API_KEY:dwh_typesense_local_dev_key}
    enabled: ${DWH_TYPESENSE_ENABLED:true}
    sync-on-startup: true


logging:
  pattern:
    level: "%5p [traceparent=%X{traceparent}] [client=%X{client_code}]"
