# The migrate profile is the ONLY place where migrations are applied (NFR-10, ADR-0007).
# Run: java -jar instance.jar --spring.profiles.active=migrate
# In production this run becomes a Nomad batch job before the app group is updated.
spring:
  main:
    web-application-type: none
  flyway:
    enabled: true
smc:
  # One-off repair of the migration history before migrating: docs/ops/migration-repair.md. Never left on.
  migrate:
    repair: ${SMC_MIGRATE_REPAIR:false}
  # Every migration file sets its own limits in its header (a concurrent index build lifts them); the pool adds none.
  database:
    statement-timeout: 0
    idle-in-transaction-timeout: 0
