# Профиль migrate — ЕДИНСТВЕННАЯ точка применения миграций (NFR-10, ADR-0007 разд. 2.3).
# Запуск: java -jar instance.jar --spring.profiles.active=migrate
# В фазе P этот запуск станет Nomad batch-job'ом перед обновлением группы app.
spring:
  main:
    web-application-type: none
  flyway:
    enabled: true
smc:
  # One-off repair of the migration history before migrating: docs/ops/migration-repair.md. Never left on.
  migrate:
    repair: ${SMC_MIGRATE_REPAIR:false}
  # Every migration file sets its own limits in its header (a concurrent index build lifts them); the pool adds none.
  database:
    statement-timeout: 0
    idle-in-transaction-timeout: 0
