# Security headers of every response of the web origin (ADR-0034, plan 10/10, item 7.4).
# nginx drops the add_header directives of an outer level as soon as a location has one of its own,
# so every location includes this file (and a CSP file) instead of relying on inheritance.
# scripts/security/test-security-headers.* checks the result on a running container.

# One year, subdomains included. Not preloaded: the preload list binds the whole registrable domain
# of an installation and is not a decision of the product (ADR-0034).
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
