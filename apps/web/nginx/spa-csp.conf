# Content-Security-Policy of the single-page application (ADR-0034, plan 10/10, item 7.4).
# Fonts and styles are local (src/fonts.css): no third-party origin is allowed.
# frame-src: the application itself plus the sources an operator lists for embedded reports
# (SMC_WEB_FRAME_SOURCES, validated by 40-smc-edge-config.sh into $smc_frame_sources).
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'report-sample'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'$smc_frame_sources" always;
