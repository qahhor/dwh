# Runtime part written at container start by 40-smc-edge-config.sh: the frame sources of the CSP
# ($smc_frame_sources) and the proxies whose X-Forwarded-For is believed (set_real_ip_from).
include /run/nginx/smc-edge.conf;

# Preserves upstream TLS indication (e.g. from outer ingress/reverse proxy) if provided,
# otherwise falls back to local scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Раздача SPA и проксирование API на бэкенд той же compose-группы.
server {
    # 8080 вместо 80: контейнер работает под non-root, порты <1024 недоступны
    listen 8080;
    server_name _;
    server_tokens off;

    # 50 MiB file contract + at most 1 MiB of multipart metadata. Spring still
    # enforces the exact per-file boundary and returns the canonical API error.
    client_max_body_size 51m;
    error_page 413 = @payload_too_large;

    # Security headers (ADR-0034): no add_header at this level. A location with an add_header of its
    # own would silently drop the ones here, so every location includes the header files itself.

    # Gzip compression for text, scripts, styles and JSON API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # Проверка живости самого nginx — не зависит от бэкенда
    location = /healthz {
        include /etc/nginx/smc/security-headers.conf;
        include /etc/nginx/smc/spa-csp.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location @payload_too_large {
        internal;
        include /etc/nginx/smc/security-headers.conf;
        include /etc/nginx/smc/api-csp.conf;
        default_type application/problem+json;
        return 413 '{"type":"urn:smartupcms:problem:file_size_exceeded","title":"FILE_SIZE_EXCEEDED","status":413,"code":"file_size_exceeded","detail":"Размер файла превышает допустимые 50 МБ"}';
    }

    # API и поток событий — на бэкенд. Имя server резолвится в сети compose.
    # ^~: a path under /api/ never reaches the asset regex below (/api/…/x.js stays an API call).
    location ^~ /api/ {
        include /etc/nginx/smc/security-headers.conf;
        include /etc/nginx/smc/api-csp.conf;
        # The server writes the same headers for direct calls; here nginx is their single source.
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;

        # Встроенный DNS Docker + переменная в proxy_pass = резолвинг на каждый
        # запрос. Без этого nginx кэширует IP бэкенда со старта и после его
        # пересоздания (любое обновление версии) отдаёт 502, пока сам не будет
        # перезапущен.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_server server:8080;
        proxy_pass http://$upstream_server$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # $remote_addr is the client: the peer itself, or the address a trusted proxy reported
        # (set_real_ip_from). The server trusts this container and takes it as the only hop.
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # SSE (FR-NOTIF-2): буферизация убила бы поток событий,
        # а короткий таймаут рвал бы соединение между heartbeat'ами.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html
    location / {
        include /etc/nginx/smc/security-headers.conf;
        include /etc/nginx/smc/spa-csp.conf;
        try_files $uri $uri/ /index.html;
    }

    # Ассеты с хешем в имени можно кэшировать надолго
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        include /etc/nginx/smc/security-headers.conf;
        include /etc/nginx/smc/spa-csp.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
