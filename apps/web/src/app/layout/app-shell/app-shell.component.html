<a class="skip-link" href="#main-content" (click)="skipToContent($event)">{{
  'layout.app_shell.pereyti_k_osnovnomu_soderzhimomu' | t
}}</a>
<div class="app-layout">
  <!-- Sidebar (Delegated Component) -->
  <app-sidebar
    [sidebarId]="sidebarId"
    [isMobile]="isMobile()"
    [isMobileMenuOpen]="isMobileMenuOpen()"
    [isCollapsed]="nav.isCollapsed()"
    [navSections]="nav.navSections()"
    [isFlyoutVisible]="flyout.isFlyoutVisible()"
    [hoveredFlyoutSection]="flyout.hoveredFlyoutSection()"
    [flyoutAnchorTop]="flyout.flyoutAnchorTop()"
    [isProfileFlyoutVisible]="flyout.isProfileFlyoutVisible()"
    [currentUser]="authService.currentUser()"
    [isSectionActive]="nav.isSectionActive"
    [isRouteActive]="nav.isRouteActive"
    [getSectionIcon]="nav.getSectionIcon"
    [getSectionBadge]="nav.getSectionBadge"
    [hasVisibleItems]="nav.hasVisibleItems"
    [isSectionExpanded]="nav.isSectionExpanded"
    [isSubmenuExpanded]="nav.isSubmenuExpanded"
    (toggleSidebar)="toggleSidebar()"
    (closeMobileMenu)="closeMobileMenu($event)"
    (onNavClick)="onNavClick()"
    (toggleSection)="nav.toggleSection($event.id, $event.event)"
    (toggleSubmenu)="nav.toggleSubmenu($event.id, $event.event)"
    (categoryClick)="flyout.onCategoryClick($event.section, $event.event)"
    (categoryMouseEnter)="onCategoryMouseEnter($event.section, $event.event)"
    (categoryMouseLeave)="flyout.onCategoryMouseLeave()"
    (profileMouseEnter)="onProfileMouseEnter($event)"
    (profileMouseLeave)="flyout.onProfileMouseLeave()"
    (flyoutMouseEnter)="flyout.onFlyoutMouseEnter()"
    (flyoutMouseLeave)="flyout.onFlyoutMouseLeave()"
    (flyoutItemClick)="onFlyoutItemClick()"
    (profileFlyoutMouseEnter)="flyout.onProfileFlyoutMouseEnter()"
    (profileFlyoutMouseLeave)="flyout.onProfileFlyoutMouseLeave()"
    (profileFlyoutClick)="onProfileFlyoutClick()"
    (logout)="authService.logout()"
  ></app-sidebar>

  <!-- Main Container -->
  <div class="main-wrapper" [attr.inert]="isMobile() && isMobileMenuOpen() ? true : null">
    <!-- Top Navigation (Delegated Component) -->
    <app-header
      [isMobile]="isMobile()"
      [isMobileMenuOpen]="isMobileMenuOpen()"
      [sidebarId]="sidebarId"
      [isChangingLanguage]="session.isChangingLanguage()"
      [isDismissingAnnouncement]="session.isDismissingAnnouncement()"
      [canReadNotifications]="session.canReadNotifications()"
      [canReadAnnouncements]="session.canReadAnnouncements()"
      (toggleMobileMenu)="toggleMobileMenu()"
      (changeLanguage)="session.changeLanguage($event)"
      (dismissAnnouncement)="session.dismissAnnouncement()"
      (logout)="authService.logout()"
    ></app-header>

    <!-- Page View Outlet -->
    <main id="main-content" #mainContent class="page-content" tabindex="-1">
      <router-outlet></router-outlet>
      <app-idle-lock-dialog />
    </main>
  </div>
</div>

<!-- Command Palette Modal -->
<app-command-palette></app-command-palette>

<!-- Global Toast Container -->
