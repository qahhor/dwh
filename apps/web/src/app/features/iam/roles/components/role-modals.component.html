<!-- Create Role Modal -->
<smt-dialog
  [open]="isCreateModalOpen()"
  [smtTitle]="'iam.roles.editor.create_title' | t"
  smtSize="sm"
  [dismissible]="!isSubmittingRole()"
  (closed)="closeCreate.emit()"
>
  <ng-template smtDialogContent>
    <form
      body
      id="role-create-form"
      class="modal-body-form"
      uiFocusFirstInvalid
      novalidate
      (submit)="$event.preventDefault(); submitCreate.emit()"
    >
      <ui-form-error-summary [errors]="summary(createErrors(), 'role-create')" />
      <smt-control [smtLabel]="'iam.roles.editor.role_name' | t" [smtError]="createErrors().fields['name'] ?? ''">
        <smt-input
          smtFieldId="role-create-name"
          smtFocusInitial
          [formField]="createForm().name"
          [placeholder]="'iam.roles.editor.name_placeholder' | t"
        />
      </smt-control>
      <smt-control
        [smtLabel]="'iam.roles.editor.display_order' | t"
        [smtError]="createErrors().fields['orderNo'] ?? ''"
      >
        <smt-input
          smtFieldId="role-create-order"
          type="number"
          class="font-mono"
          [smtStep]="1"
          [formField]="createForm().orderNo"
          placeholder="0"
        />
      </smt-control>
    </form>
    <ui-form-actions
      footer
      form="role-create-form"
      [submitLabel]="'common.create' | t"
      [submitting]="isSubmittingRole()"
      (cancelled)="closeCreate.emit()"
    />
  </ng-template>
</smt-dialog>

<!-- Edit Role Modal -->
<smt-dialog
  [open]="isEditModalOpen()"
  [smtTitle]="'iam.roles.editor.edit_title' | t"
  smtSize="sm"
  [dismissible]="!isSubmittingRole()"
  (closed)="closeEdit.emit()"
>
  <ng-template smtDialogContent>
    @if (editingRole(); as r) {
      <form
        body
        id="role-edit-form"
        class="modal-body-form"
        uiFocusFirstInvalid
        novalidate
        (submit)="$event.preventDefault(); submitEdit.emit()"
      >
        <ui-form-error-summary [errors]="summary(editErrors(), 'role-edit')" />
        <smt-control [smtLabel]="'iam.roles.editor.role_name' | t" [smtError]="editErrors().fields['name'] ?? ''">
          <smt-input smtFieldId="role-edit-name" smtFocusInitial [formField]="editForm().name" />
        </smt-control>
        <smt-control
          [smtLabel]="'iam.common.activity_status' | t"
          [smtHint]="r.pcode === 'admin' ? ('iam.roles.editor.super_admin_always_active' | t) : ''"
          [smtError]="editErrors().fields['state'] ?? ''"
        >
          <smt-select
            smtTriggerId="role-edit-state"
            [formField]="editForm().state"
            [options]="stateOptions()"
            [allowClear]="false"
          />
        </smt-control>
        <smt-control
          [smtLabel]="'iam.roles.editor.display_order' | t"
          [smtError]="editErrors().fields['orderNo'] ?? ''"
        >
          <smt-input
            smtFieldId="role-edit-order"
            type="number"
            class="font-mono"
            [smtStep]="1"
            [formField]="editForm().orderNo"
          />
        </smt-control>
      </form>
    }
    <ui-form-actions footer form="role-edit-form" [submitting]="isSubmittingRole()" (cancelled)="closeEdit.emit()" />
  </ng-template>
</smt-dialog>

<!-- Delete Role Modal -->
<smt-dialog
  [open]="isDeleteModalOpen()"
  [smtTitle]="'iam.roles.editor.delete_title' | t"
  smtSize="sm"
  [dismissible]="!isSubmittingRole()"
  (closed)="closeDelete.emit()"
>
  <ng-template smtDialogContent>
    @if (deletingRole(); as r) {
      <div body class="modal-delete-body">
        <p class="delete-title">
          {{ 'iam.roles.editor.delete_confirm' | t }} <strong>{{ r.name }}</strong
          >?
        </p>
        <span class="delete-desc">{{ 'iam.roles.editor.delete_warning' | t }}</span>
      </div>
    }
    <ui-form-actions
      footer
      submitVariant="danger"
      [submitLabel]="'common.delete' | t"
      [submitting]="isSubmittingRole()"
      (submitted)="confirmDelete.emit()"
      (cancelled)="closeDelete.emit()"
    />
  </ng-template>
</smt-dialog>

<!-- Unsaved Changes Confirmation Modal -->
<smt-dialog
  [open]="isDiscardPermissionsModalOpen()"
  [smtTitle]="'iam.roles.editor.unsaved_permission_changes' | t"
  smtSize="sm"
  [dismissible]="!isSaving()"
  (closed)="closeDiscard.emit()"
>
  <ng-template smtDialogContent>
    @if (selectedRole(); as r) {
      <div body class="modal-delete-body">
        <p class="delete-title">
          {{ 'iam.roles.editor.unsaved_switch_confirm' | t: { name: r.name, count: dirtyPermissionsCount() } }}
        </p>
      </div>
    }
    <ui-form-actions
      footer
      [submitLabel]="'iam.roles.editor.save_and_switch' | t"
      [submitting]="isSaving()"
      (submitted)="saveAndSwitch.emit()"
      (cancelled)="closeDiscard.emit()"
    >
      <button
        smt-button
        type="button"
        smtVariant="danger"
        [disabled]="isSaving()"
        (click)="confirmDiscardAndSwitch.emit()"
      >
        {{ 'iam.roles.editor.discard_and_switch' | t }}
      </button>
    </ui-form-actions>
  </ng-template>
</smt-dialog>
