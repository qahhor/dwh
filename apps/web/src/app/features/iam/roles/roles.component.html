<div class="roles-page">
  <!-- Top Page Header -->
  <ui-page-header [title]="'iam.roles.title' | t" [count]="roles().length">
    @if (canCreateRole()) {
      <button
        smt-button
        type="button"
        smtVariant="primary"
        smtSize="md"
        smtIcon="add"
        (click)="roleForms.openCreateModal()"
      >
        {{ 'iam.roles.new_role' | t }}
      </button>
    }
  </ui-page-header>

  <!-- Roles Horizontal Bar -->
  <app-role-cards-bar
    [roles]="filteredRoles()"
    [selectedRole]="matrix.selectedRole()"
    [roleUserCounts]="roleUserCounts()"
    [searchQuery]="roleSearchQuery"
    (searchQueryChange)="roleSearchQuery = $event"
    [isSaving]="matrix.isSaving()"
    [scopePanelBusy]="scopePanelBusy()"
    [isSubmittingRole]="roleForms.isSubmittingRole()"
    [canCreateRole]="canCreateRole()"
    [canUpdateRole]="canUpdateRole()"
    [canDeleteRole]="canDeleteRole()"
    (selectRole)="selectRole($event)"
    (navigateToUsers)="navigateToUsersWithRole($event.role, $event.event)"
    (openEdit)="roleForms.openEditRoleModal($event)"
    (openDelete)="openDeleteRoleModal($event)"
    (openCreate)="roleForms.openCreateModal()"
  ></app-role-cards-bar>

  <!-- Main Permission Matrix Section -->
  @if (matrix.selectedRole(); as role) {
    <div class="matrix-card" [attr.aria-busy]="matrix.isLoading() || matrix.isSaving()">
      <app-role-permissions-matrix
        [role]="role"
        [isLoading]="matrix.isLoading()"
        [isSaving]="matrix.isSaving()"
        [permissionsError]="matrix.permissionsError()"
        [activePermissionsCount]="activePermissionsCount()"
        [totalActionsCount]="totalActionsCount()"
        [permissionPercentage]="permissionPercentage()"
        [isPermissionsDirty]="matrix.isPermissionsDirty()"
        [dirtyPermissionsCount]="matrix.dirtyPermissionsCount()"
        [canGrant]="matrix.canGrant()"
        [canEditPermissions]="matrix.canEditPermissions()"
        [matrixSearchQuery]="matrixSearchQuery"
        [matchingFormsCount]="matchingFormsCount()"
        [formsCount]="forms().length"
        [selectedModuleTab]="selectedModuleTab"
        [moduleGroups]="moduleGroups"
        [visibleModuleGroups]="visibleModuleGroups()"
        [hasPermission]="matrix.hasPermission"
        [isPermissionDirty]="matrix.isPermissionDirty"
        [getModuleIcon]="getModuleIcon"
        [getModuleActionsCount]="getModuleActionsCount"
        (resetChanges)="matrix.resetMatrixChanges()"
        (savePermissions)="savePermissions()"
        (refreshRole)="selectRole($event)"
        (matrixSearchQueryChange)="matrixSearchQuery = $event"
        (selectedModuleTabChange)="selectedModuleTab = $event"
        (setAllModulesExpanded)="setAllModulesExpanded($event)"
        (toggleAllPermissions)="toggleAllPermissions($event)"
        (toggleReadOnlyAllPermissions)="toggleReadOnlyAllPermissions()"
        (toggleModuleExpand)="toggleModuleExpand($event)"
        (toggleReadOnlyModule)="matrix.toggleReadOnlyModule($event)"
        (toggleAllModule)="matrix.toggleAllModule($event.mod, $event.select)"
        (toggleAllForm)="matrix.toggleAllForm($event.form, $event.select)"
        (togglePermission)="matrix.togglePermission($event.formCode, $event.action, $event.checked)"
      ></app-role-permissions-matrix>
      @if (canViewOrgUnits() && safeRoleId(role.id)) {
        <app-role-scope-panel
          [roleId]="role.id"
          [revision]="role.revision"
          (busyChange)="scopePanelBusy.set($event)"
          (revisionChange)="onScopeRevision(role, $event)"
          (staleRole)="loadRoles()"
        ></app-role-scope-panel>
      }
    </div>
  }
</div>

<!-- Modals (Create, Edit, Delete, Discard) -->
<app-role-modals
  [isCreateModalOpen]="roleForms.isCreateModalOpen()"
  [createForm]="roleForms.createForm"
  [createErrors]="roleForms.createErrors()"
  [isEditModalOpen]="roleForms.isEditModalOpen()"
  [editForm]="roleForms.editForm"
  [editErrors]="roleForms.editErrors()"
  [editingRole]="roleForms.editingRole()"
  [isDeleteModalOpen]="roleForms.isDeleteModalOpen()"
  [deletingRole]="roleForms.deletingRole"
  [isDiscardPermissionsModalOpen]="isDiscardPermissionsModalOpen()"
  [selectedRole]="matrix.selectedRole()"
  [dirtyPermissionsCount]="matrix.dirtyPermissionsCount()"
  [isSubmittingRole]="roleForms.isSubmittingRole()"
  [isSaving]="matrix.isSaving()"
  (closeCreate)="roleForms.requestCloseCreate()"
  (submitCreate)="submitCreateRole()"
  (closeEdit)="roleForms.requestCloseEdit()"
  (submitEdit)="submitEditRole()"
  (closeDelete)="roleForms.closeDeleteRoleModal()"
  (confirmDelete)="confirmDeleteRole()"
  (closeDiscard)="closeDiscardModal()"
  (confirmDiscardAndSwitch)="confirmDiscardAndSwitch()"
  (saveAndSwitch)="saveAndSwitch()"
></app-role-modals>
