<div class="users-view">
  <!-- Minimal Header -->
  <ui-page-header [title]="'nav.users' | t">
    @if (canCreateUser()) {
      <button smt-button type="button" smtVariant="primary" smtSize="md" smtIcon="add" (click)="openCreateModal()">
        {{ 'iam.novyy_polzovatel' | t }}
      </button>
    }
  </ui-page-header>

  <!-- Toolbar and Active Filters (Delegated Component) -->
  <app-user-filter-bar
    [searchQuery]="filterService.searchQuery"
    [selectedState]="filterService.selectedState"
    [isFilterMenuOpen]="filterService.isFilterMenuOpen()"
    [hasExtraFilters]="filterService.hasExtraFilters()"
    [roles]="list.roles()"
    [selectedRoleId]="filterService.selectedRoleId"
    [selected2fa]="filterService.selected2fa"
    [isLoading]="list.isLoading()"
    [hasAnyActiveFilters]="filterService.hasAnyActiveFilters()"
    [selectedRoleName]="list.selectedRoleName()"
    (searchQueryChange)="filterService.searchQuery = $event"
    (searchInput)="list.onSearchInput()"
    (clearSearch)="list.clearSearch()"
    (stateFilterChange)="list.setStateFilter($event)"
    (toggleFilterMenu)="filterService.toggleFilterMenu($event)"
    (resetExtraFilters)="list.resetExtraFilters()"
    (roleFilterChange)="filterService.selectedRoleId = $event; list.loadUsers(true)"
    (twoFactorFilterChange)="filterService.selected2fa = $event; list.loadUsers(true)"
    (refresh)="list.loadUsers(true)"
    (clearStateFilter)="list.clearStateFilter()"
    (clearRoleFilter)="list.clearRoleFilter()"
    (clear2faFilter)="list.clear2faFilter()"
    (resetAllFilters)="list.resetAllFilters()"
  ></app-user-filter-bar>

  <!-- The list on the registry table (query-meta/iam.users) -->
  @if (list.metaError()) {
    <smt-alert smtTone="danger" data-testid="users-meta-error">
      <span>{{ 'iam.users.load_error' | t }}</span>
      <button smt-button type="button" smtVariant="secondary" smtSize="sm" (click)="list.loadUsers(true)">
        {{ 'common.retry' | t }}
      </button>
    </smt-alert>
  }
  <app-user-table-view
    [pager]="list.userPager"
    [meta]="list.meta()"
    [views]="list.views"
    [exportSearch]="filterService.searchQuery"
    [exportOptions]="list.exportOptions()"
    (sortChange)="list.onSort($event)"
    [canUpdateUser]="canUpdateUser()"
    [canBlockUser]="canBlockUser()"
    [canUnblockUser]="canUnblockUser()"
    [canDeleteUser]="canDeleteUser()"
    [getUserRoleNames]="getUserRoleNamesFn"
    [getManagerName]="getManagerNameFn"
    (viewUser)="openViewModal($event)"
    (editUser)="openEditModal($event)"
    (toggleState)="list.toggleUserState($event.user, $event.action)"
    (deleteUser)="list.openDeleteConfirmModal($event)"
  ></app-user-table-view>
</div>

<!-- Create User Modal (Delegated Component) -->
<app-user-create-modal
  [isOpen]="formsService.isCreateModalOpen()"
  [isSubmitting]="formsService.isSubmitting()"
  [isCreateSubmitted]="formsService.isCreateSubmitted"
  [createForm]="formsService.createForm"
  [roles]="list.roles()"
  [languages]="i18n.languages()"
  [customFields]="list.customFields()"
  [passwordStrength]="formsService.passwordStrength()"
  [hasMinLength]="formsService.hasMinLength()"
  [hasUpperAndLower]="formsService.hasUpperAndLower()"
  [hasDigitsOrSymbols]="formsService.hasDigitsOrSymbols()"
  [doesNotContainLogin]="formsService.doesNotContainLogin()"
  (close)="formsService.isCreateModalOpen.set(false)"
  (submit)="submitCreateUser()"
  (generatePassword)="formsService.generateSecurePassword()"
  (copyPassword)="formsService.copyGeneratedPassword()"
></app-user-create-modal>

<!-- Edit User Modal (Delegated Component) -->
<app-user-edit-modal
  [isOpen]="formsService.isEditModalOpen()"
  [isSubmitting]="formsService.isSubmitting()"
  [isEditSubmitted]="formsService.isEditSubmitted"
  [editingUser]="formsService.editingUser"
  [editForm]="formsService.editForm"
  [roles]="list.roles()"
  [languages]="i18n.languages()"
  [customFields]="list.customFields()"
  (close)="closeEditModal()"
  (submit)="submitEditUser()"
></app-user-edit-modal>

<!-- User Detail, Delete and Security Modals (Delegated Component) -->
<app-user-detail-modal
  [isOpen]="isViewModalOpen()"
  [viewingUser]="viewingUser()"
  [routeRecordId]="routeRecordId()"
  [recordLoading]="recordLoading()"
  [recordError]="recordError()"
  [recordNotFound]="recordNotFound()"
  [activeViewTab]="activeViewTab()"
  [isLoadingSecurity]="secService.isLoadingSecurity()"
  [userSecurity]="secService.userSecurity()"
  [isSecurityActionPending]="secService.isSecurityActionPending()"
  [canUpdateUser]="canUpdateUser()"
  [canViewOrgUnits]="canViewOrgUnits()"
  [canViewAssignments]="canViewAssignments()"
  [canAssignPermissions]="canAssignPermissions()"
  [safeRecordId]="safeRecordId"
  [getUserRoleNames]="getUserRoleNamesFn"
  [getManagerName]="getManagerNameFn"
  [isSubmitting]="formsService.isSubmitting()"
  (closeRecordView)="closeRecordView()"
  (retryRecordView)="loadRecordView($event)"
  (switchTab)="switchViewTab($event.tab, $event.userId)"
  (openEdit)="openEditFromView()"
  (forcePasswordChange)="forcePasswordChange($event)"
  (reset2fa)="resetUser2fa($event)"
  (terminateAllSessions)="secService.terminateUserSessions($event)"
  (terminateSingleSession)="secService.terminateSingleSession($event.sessionId, $event.userId)"
  (orgPanelBusy)="orgPanelBusy.set($event)"
></app-user-detail-modal>
