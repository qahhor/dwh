<smt-dialog
  [open]="isOpen()"
  [smtTitle]="'tasks.editor.edit_title' | t"
  smtSize="lg"
  [dismissible]="!isSubmitting()"
  (closed)="closeModal.emit()"
>
  <ng-template smtDialogContent>
    @if (editLoading()) {
      <div body class="request-state request-loading" role="status">
        {{ 'tasks.edit_loading' | t }}
      </div>
    }
    @if (editLoadError()) {
      <div body class="request-state request-error" role="alert">
        <span>{{ 'tasks.edit_load_error' | t }}</span>
        <button smt-button type="button" smtVariant="secondary" smtSize="sm" (click)="retryEditLoad.emit()">
          {{ 'common.retry' | t }}
        </button>
      </div>
    }
    @if (editingTask(); as task) {
      <form
        [id]="formId"
        class="task-edit-form-wrap"
        uiFocusFirstInvalid
        novalidate
        (submit)="$event.preventDefault(); submitForm.emit()"
      >
        <ui-form-error-summary [errors]="summary()" />
        <fieldset class="modal-form modal-form-fieldset task-edit-form" [disabled]="isSubmitting()">
          <!-- Title Input (Required) -->
          <smt-control class="form-group" [smtLabel]="'task.title' | t" [smtError]="titleError()" [required]="true">
            <smt-input
              smtFieldId="task-edit-title"
              smtFocusInitial
              name="taskEditTitle"
              class="title-input"
              [value]="editForm().title"
              (valueChange)="editForm().title = $event?.toString() ?? ''"
              (touch)="titleTouched.set(true)"
            />
          </smt-control>

          <!-- Visual Type Selector Chips -->
          <smt-control
            class="form-group"
            [smtLabel]="'tasks.common.task_type' | t"
            [smtError]="serverErrors().fields['taskType'] ?? ''"
          >
            <smt-radio-group
              smtFieldId="task-edit-type"
              smtAppearance="chips"
              [options]="typeOptions()"
              [value]="editForm().taskType"
              (valueChange)="editForm().taskType = $event ?? editForm().taskType"
            />
          </smt-control>

          <!-- Visual Priority Selector Pills -->
          <smt-control
            class="form-group"
            [smtLabel]="'common.priority' | t"
            [smtError]="serverErrors().fields['priority'] ?? ''"
          >
            <smt-radio-group
              smtFieldId="task-edit-priority"
              smtAppearance="segmented"
              [options]="priorityOptions()"
              [value]="editForm().priority"
              (valueChange)="editForm().priority = $event ?? editForm().priority"
            />
          </smt-control>

          <div class="form-grid-2">
            <!-- Project Selector -->
            <smt-control
              class="form-group"
              [smtLabel]="'projects.common.project' | t"
              [smtError]="serverErrors().fields['projectId'] ?? ''"
            >
              <smt-data-select
                smtTriggerId="task-edit-project"
                [source]="lookups.projects"
                [knownRows]="knownProjectRows()"
                [value]="editForm().projectId"
                (valueChange)="editForm().projectId = $event"
                [placeholder]="'tasks.editor.no_project' | t"
                [searchPlaceholder]="'tasks.search_project' | t"
                [emptyLabel]="'tasks.editor.no_project' | t"
              />
            </smt-control>

            <!-- Parent Task (Searchable Select) -->
            <smt-control
              class="form-group"
              [smtLabel]="'task.parent' | t"
              [smtError]="serverErrors().fields['parentTaskId'] ?? ''"
            >
              <smt-data-select
                smtTriggerId="task-edit-parent"
                [source]="lookups.tasks"
                [knownRows]="lookups.knownParentRows()"
                [exclude]="notThisTask"
                [value]="editForm().parentTaskId"
                (valueChange)="editForm().parentTaskId = $event"
                [placeholder]="'tasks.editor.no_parent' | t"
                [searchPlaceholder]="'tasks.editor.parent_search_placeholder' | t"
                [emptyLabel]="'tasks.without_parent' | t"
              />
            </smt-control>
          </div>

          <div class="form-grid-2">
            <!-- Responsible User (Searchable Select) -->
            <smt-control
              class="form-group"
              [smtLabel]="'task.responsible' | t"
              [smtError]="serverErrors().fields['responsibleUserId'] ?? ''"
            >
              <smt-data-select
                smtTriggerId="task-edit-responsible"
                [source]="lookups.users"
                [knownRows]="lookups.knownUserRows()"
                [value]="editForm().responsibleUserId"
                (valueChange)="editForm().responsibleUserId = $event"
                [placeholder]="'tasks.editor.select_assignee' | t"
                [searchPlaceholder]="'tasks.common.employee_search_placeholder' | t"
                [emptyLabel]="'common.not_assigned' | t"
              />
            </smt-control>

            <!-- Deadlines: End Date / Deadline -->
            <smt-control
              class="form-group"
              [smtLabel]="'tasks.editor.due_date' | t"
              [smtError]="serverErrors().fields['endTime'] ?? ''"
            >
              <smt-date-picker
                smtInputId="task-edit-deadline"
                name="taskEditDeadline"
                smtWithTime
                [value]="editForm().endTime"
                (valueChange)="editForm().endTime = $event ?? ''"
              />
            </smt-control>
          </div>

          <!-- Executors Searchable Multi-Select Tags Input -->
          <smt-control
            class="form-group"
            [smtLabel]="'tasks.common.co_executors' | t"
            [smtError]="serverErrors().fields['executorUserIds'] ?? ''"
          >
            <smt-multi-data-select
              [source]="lookups.users"
              [knownRows]="lookups.knownUserRows()"
              [value]="editForm().executorUserIds"
              [ariaLabel]="'tasks.common.co_executors' | t"
              (valueChange)="editForm().executorUserIds = [...$event]"
              [placeholder]="'tasks.editor.add_co_executors_hint' | t"
              [searchPlaceholder]="'tasks.editor.employee_search' | t"
            />
          </smt-control>

          <!-- Observers Searchable Multi-Select Tags Input -->
          <smt-control
            class="form-group"
            [smtLabel]="'tasks.editor.observers_hint' | t"
            [smtError]="serverErrors().fields['observerUserIds'] ?? ''"
          >
            <smt-multi-data-select
              [source]="lookups.users"
              [knownRows]="lookups.knownUserRows()"
              [value]="editForm().observerUserIds"
              [ariaLabel]="'tasks.common.observers' | t"
              (valueChange)="editForm().observerUserIds = [...$event]"
              [placeholder]="'tasks.editor.add_observers_hint' | t"
              [searchPlaceholder]="'tasks.editor.employee_search' | t"
            />
          </smt-control>

          <!-- RichText Markdown Editor for Description: the editor names its own text area. -->
          <div class="form-group">
            <div class="label-row">
              <span class="clean-label" aria-hidden="true">{{ 'projects.common.description' | t }}</span>
            </div>
            <ui-markdown-editor
              [value]="editForm().descriptionMarkdown"
              [ariaLabel]="'projects.common.description' | t"
              (valueChange)="editForm().descriptionMarkdown = $event"
              [rows]="4"
            ></ui-markdown-editor>
          </div>

          <!-- Custom Dynamic Fields -->
          @if (taskCustomFields().length > 0) {
            <div class="custom-fields-section">
              <h4 class="custom-fields-title">{{ 'nav.custom_fields' | t }}</h4>
              <ui-custom-fields [fields]="taskCustomFields()" [(values)]="editForm().attributes"></ui-custom-fields>
            </div>
          }
        </fieldset>
      </form>
      <ui-form-actions
        footer
        [form]="formId"
        data-testid="task-edit-actions"
        [submitLabel]="'tasks.editor.save_changes' | t"
        [submitting]="isSubmitting()"
        (cancelled)="closeModal.emit()"
      />
    } @else {
      <!-- Nothing to save while the task loads or failed to load: the only action closes the dialog. -->
      <ui-form-actions
        footer
        data-testid="task-edit-actions"
        [showCancel]="false"
        [submitLabel]="'common.close' | t"
        (submitted)="closeModal.emit()"
      />
    }
  </ng-template>
</smt-dialog>
