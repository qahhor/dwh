<smt-dialog
  [open]="isOpen()"
  [smtTitle]="
    createForm().parentTaskId
      ? ('tasks.create_subtask_for' | t: { id: createForm().parentTaskId ?? '' })
      : ('tasks.create_new_task' | t)
  "
  smtSize="lg"
  [dismissible]="!isSubmitting()"
  (closed)="closeModal.emit()"
>
  <ng-template smtDialogContent>
    <form
      [id]="formId"
      class="task-create-form-wrap"
      uiFocusFirstInvalid
      novalidate
      (submit)="$event.preventDefault(); submitForm.emit()"
    >
      <ui-form-error-summary [errors]="summary()" />
      <fieldset class="modal-form modal-form-fieldset task-create-form" [disabled]="isSubmitting()">
        <!-- Title Input (Required) -->
        <smt-control class="form-group" [smtLabel]="'task.title' | t" [smtError]="titleError()" [required]="true">
          <smt-input
            smtFieldId="task-create-title"
            smtFocusInitial
            name="taskCreateTitle"
            class="title-input"
            [value]="createForm().title"
            (valueChange)="setField('title', $event?.toString() ?? '')"
            (touch)="titleTouched.set(true)"
            [placeholder]="'tasks.editor.title_placeholder' | t"
          />
        </smt-control>

        <div class="form-grid-2">
          <!-- Responsible User (Searchable Select) -->
          <smt-control
            class="form-group"
            [smtLabel]="'task.responsible' | t"
            [smtError]="serverErrors().fields['responsibleUserId'] ?? ''"
          >
            <smt-data-select
              smtTriggerId="task-create-responsible"
              [source]="lookups.users"
              [knownRows]="lookups.knownUserRows()"
              [value]="createForm().responsibleUserId"
              (valueChange)="setField('responsibleUserId', $event)"
              [placeholder]="'tasks.editor.select_assignee' | t"
              [searchPlaceholder]="'tasks.common.employee_search_placeholder' | t"
              [emptyLabel]="'common.not_assigned' | t"
            />
          </smt-control>

          <!-- Deadlines: End Date / Deadline -->
          <smt-control
            class="form-group"
            [smtLabel]="'tasks.editor.due_date' | t"
            [smtError]="serverErrors().fields['endTime'] ?? ''"
          >
            <smt-date-picker
              smtInputId="task-create-deadline"
              name="taskCreateDeadline"
              smtWithTime
              [value]="createForm().endTime"
              (valueChange)="setField('endTime', $event ?? '')"
            />
          </smt-control>
        </div>

        <!-- Project Selector -->
        <smt-control
          class="form-group"
          [smtLabel]="'projects.common.project' | t"
          [smtError]="serverErrors().fields['projectId'] ?? ''"
        >
          <smt-data-select
            smtTriggerId="task-create-project"
            [source]="lookups.projects"
            [knownRows]="lookups.knownProjectRows()"
            [value]="createForm().projectId"
            (valueChange)="setField('projectId', $event)"
            [placeholder]="'tasks.editor.no_project' | t"
            [searchPlaceholder]="'tasks.search_project' | t"
            [emptyLabel]="'tasks.editor.no_project' | t"
          />
        </smt-control>

        <!-- RichText Markdown Editor for Description: the editor names its own text area. -->
        <div class="form-group">
          <div class="label-row">
            <span class="clean-label" aria-hidden="true">{{ 'projects.common.description' | t }}</span>
          </div>
          <ui-markdown-editor
            [value]="createForm().descriptionMarkdown"
            [ariaLabel]="'projects.common.description' | t"
            (valueChange)="setField('descriptionMarkdown', $event)"
            [placeholder]="'tasks.editor.description_placeholder' | t"
            [rows]="4"
          ></ui-markdown-editor>
        </div>

        <!-- Custom Dynamic Fields -->
        @if (taskCustomFields().length > 0) {
          <div class="custom-fields-section">
            <h4 class="custom-fields-title">
              <span>{{ 'nav.custom_fields' | t }}</span>
            </h4>
            <ui-custom-fields [fields]="taskCustomFields()" [(values)]="createForm().attributes"></ui-custom-fields>
          </div>
        }

        <div class="task-additional-section">
          <button
            smt-button
            type="button"
            smtVariant="ghost"
            class="task-additional-toggle"
            data-testid="task-create-additional-toggle"
            aria-controls="task-create-additional"
            [attr.aria-expanded]="additionalOpen()"
            [disabled]="hasAdditionalErrors()"
            (click)="toggleAdditional()"
          >
            <span class="task-additional-label">
              <span class="material-symbols-outlined" aria-hidden="true">{{
                additionalOpen() ? 'expand_less' : 'expand_more'
              }}</span>
              {{ 'tasks.editor.additional' | t }}
            </span>
            <span class="task-additional-summary">{{ additionalSummary() }}</span>
          </button>
          <div id="task-create-additional" class="task-additional-fields" [hidden]="!additionalOpen()">
            <!-- Visual Type Selector Chips -->
            <smt-control
              class="form-group"
              [smtLabel]="'tasks.common.task_type' | t"
              [smtError]="serverErrors().fields['taskType'] ?? ''"
            >
              <smt-radio-group
                smtFieldId="task-create-type"
                smtAppearance="chips"
                [options]="typeOptions()"
                [disabled]="isSubmitting()"
                [value]="createForm().taskType"
                (valueChange)="setField('taskType', $event ?? createForm().taskType)"
              />
            </smt-control>

            <!-- Visual Priority Selector Pills -->
            <smt-control
              class="form-group"
              [smtLabel]="'common.priority' | t"
              [smtError]="serverErrors().fields['priority'] ?? ''"
            >
              <smt-radio-group
                smtFieldId="task-create-priority"
                smtAppearance="segmented"
                [options]="priorityOptions()"
                [disabled]="isSubmitting()"
                [value]="createForm().priority"
                (valueChange)="setField('priority', $event ?? createForm().priority)"
              />
            </smt-control>

            <!-- Parent Task (Searchable Select) -->
            <smt-control
              class="form-group"
              [smtLabel]="'task.parent' | t"
              [smtError]="serverErrors().fields['parentTaskId'] ?? ''"
            >
              <smt-data-select
                smtTriggerId="task-create-parent"
                [source]="lookups.tasks"
                [knownRows]="lookups.knownParentRows()"
                [value]="createForm().parentTaskId"
                (valueChange)="setField('parentTaskId', $event)"
                [placeholder]="'tasks.editor.no_parent' | t"
                [searchPlaceholder]="'tasks.editor.parent_search_placeholder' | t"
                [emptyLabel]="'tasks.without_parent' | t"
              />
            </smt-control>
            <!-- Executors Searchable Multi-Select Tags Input -->
            <smt-control
              class="form-group"
              [smtLabel]="'tasks.common.co_executors' | t"
              [smtError]="serverErrors().fields['executorUserIds'] ?? ''"
            >
              <smt-multi-data-select
                [source]="lookups.users"
                [knownRows]="lookups.knownUserRows()"
                [value]="createForm().executorUserIds"
                [ariaLabel]="'tasks.common.co_executors' | t"
                (valueChange)="setField('executorUserIds', [...$event])"
                [placeholder]="'tasks.editor.add_co_executors_hint' | t"
                [searchPlaceholder]="'tasks.editor.employee_search' | t"
              />
            </smt-control>

            <!-- Observers Searchable Multi-Select Tags Input -->
            <smt-control
              class="form-group"
              [smtLabel]="'tasks.editor.observers_hint' | t"
              [smtError]="serverErrors().fields['observerUserIds'] ?? ''"
            >
              <smt-multi-data-select
                [source]="lookups.users"
                [knownRows]="lookups.knownUserRows()"
                [value]="createForm().observerUserIds"
                [ariaLabel]="'tasks.common.observers' | t"
                (valueChange)="setField('observerUserIds', [...$event])"
                [placeholder]="'tasks.editor.add_observers_hint' | t"
                [searchPlaceholder]="'tasks.editor.employee_search' | t"
              />
            </smt-control>
          </div>
        </div>
      </fieldset>
    </form>
    <ui-form-actions
      footer
      [form]="formId"
      data-testid="task-create-actions"
      [submitLabel]="'tasks.editor.create_task' | t"
      [submitting]="isSubmitting()"
      (cancelled)="closeModal.emit()"
    />
  </ng-template>
</smt-dialog>
