<div class="nav-settings-page">
  <!-- Header -->
  <ui-page-header [title]="'nav.settings.navigation_title' | t" [subtitle]="'nav.settings.navigation_subtitle' | t">
    <button smt-button type="button" smtVariant="primary" smtIcon="add" (click)="openCreateModal()">
      {{ 'nav.settings.add_item' | t }}
    </button>
  </ui-page-header>

  <!-- Stats Summary -->
  <app-navigation-settings-stats
    [totalCount]="store.items().length"
    [activeCount]="store.activeCount()"
    [embeddedCount]="store.embeddedCount()"
    [externalCount]="store.externalCount()"
  ></app-navigation-settings-stats>

  <!-- Table & Filters -->
  <app-navigation-settings-table
    [items]="filteredItems()"
    [isLoading]="store.isLoading()"
    [searchQuery]="searchQuery"
    (searchQueryChange)="searchQuery = $event"
    (clearSearch)="searchQuery = ''"
    (toggleItem)="store.toggleItem($event)"
    (previewItem)="previewItem($event)"
    (editItem)="openEditModal($event)"
    (deleteItem)="store.confirmDelete($event)"
  ></app-navigation-settings-table>

  <!-- Modals (Create/Edit & Delete) -->
  <app-navigation-settings-modal
    [isModalOpen]="isModalOpen()"
    [editingItem]="editingItem()"
    [isSubmitting]="store.isSubmitting()"
    [itemForm]="itemForm"
    [serverErrors]="store.fieldErrors()"
    [permissionChoices]="store.permissionChoices()"
    [popularIcons]="popularIcons"
    (titleChange)="onTitleChange($event)"
    (urlBlur)="onUrlBlur()"
    (closeModal)="requestCloseModal()"
    (saveItem)="saveItem()"
  ></app-navigation-settings-modal>
</div>
