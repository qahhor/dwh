<div class="md-editor-container" [class.focused]="isFocused">
  <!-- Toolbar -->
  <div class="md-toolbar" role="toolbar" [attr.aria-label]="'ui.markdown_editor.toolbar' | t">
    <div class="toolbar-actions">
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('bold')"
        [attr.aria-label]="'ui.markdown_editor.bold' | t"
        [title]="'ui.markdown_editor.bold_ctrl_b' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">format_bold</span>
      </button>
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('italic')"
        [attr.aria-label]="'ui.markdown_editor.italic' | t"
        [title]="'ui.markdown_editor.italic_ctrl_i' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">format_italic</span>
      </button>
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('strike')"
        [attr.aria-label]="'ui.markdown_editor.strikethrough' | t"
        [title]="'ui.markdown_editor.strikethrough_title' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">format_strikethrough</span>
      </button>
      <span class="tool-sep" role="separator" aria-orientation="vertical"></span>

      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('h2')"
        [attr.aria-label]="'ui.markdown_editor.heading' | t"
        [title]="'ui.markdown_editor.heading' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">title</span>
      </button>
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('bullet-list')"
        [attr.aria-label]="'ui.markdown_editor.bulleted_list' | t"
        [title]="'ui.markdown_editor.bulleted_list' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">format_list_bulleted</span>
      </button>
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('num-list')"
        [attr.aria-label]="'ui.markdown_editor.numbered_list' | t"
        [title]="'ui.markdown_editor.numbered_list' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">format_list_numbered</span>
      </button>
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('task-list')"
        [attr.aria-label]="'ui.markdown_editor.task_checklist' | t"
        [title]="'ui.markdown_editor.task_checklist' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">checklist</span>
      </button>
      <span class="tool-sep" role="separator" aria-orientation="vertical"></span>

      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('code')"
        [attr.aria-label]="'settings.common.code' | t"
        [title]="'settings.common.code' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">code</span>
      </button>
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('quote')"
        [attr.aria-label]="'ui.markdown_editor.quote' | t"
        [title]="'ui.markdown_editor.quote' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">format_quote</span>
      </button>
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('link')"
        [attr.aria-label]="'ui.markdown_editor.link' | t"
        [title]="'ui.markdown_editor.link' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">link</span>
      </button>
      <button
        type="button"
        class="tool-btn"
        (click)="insertFormat('table')"
        [attr.aria-label]="'audit.common.table' | t"
        [title]="'audit.common.table' | t"
      >
        <span class="material-symbols-outlined" aria-hidden="true">table</span>
      </button>
    </div>

    <!-- Mode Toggle Tabs -->
    <smt-tab-bar
      class="smt-tab-bar--compact"
      [tabs]="modeTabs()"
      [value]="mode"
      [smtAriaLabel]="'ui.markdown_editor.markdown_mode' | t"
      (valueChange)="mode = $event ?? mode"
    />
  </div>

  <!-- Editor Content -->
  <div class="md-body">
    <!-- Textarea Mode -->
    @if (mode === 'edit') {
      <div class="editor-pane" role="tabpanel" [id]="editPanelId" [attr.aria-labelledby]="editTabId">
        <label class="sr-only" [for]="textareaId">{{ ariaLabel() || ('ui.markdown_editor.text_label' | t) }}</label>
        <textarea
          #textareaRef
          [id]="textareaId"
          class="md-textarea"
          [rows]="rows()"
          [placeholder]="placeholder()"
          [value]="value()"
          (input)="onTextInput($event)"
          (focus)="isFocused = true"
          (blur)="isFocused = false"
          (keydown)="handleKeydown($event)"
        ></textarea>
      </div>
    }

    <!-- Preview Mode -->
    @if (mode === 'preview') {
      <div
        class="md-preview-pane"
        role="tabpanel"
        [id]="previewPanelId"
        [attr.aria-labelledby]="previewTabId"
        [innerHTML]="renderMarkdown(value())"
      ></div>
    }
  </div>
</div>
