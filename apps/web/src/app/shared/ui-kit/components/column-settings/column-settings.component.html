<!-- Our template, after the idea of the kit's data-table settings modal (smartup-ui-kit@6472beb). See the component header. -->
<button
  #trigger
  type="button"
  class="smt-columns__trigger"
  cdkOverlayOrigin
  #origin="cdkOverlayOrigin"
  aria-haspopup="dialog"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? panelId : null"
  (click)="toggle()">
  <span class="material-symbols-outlined" aria-hidden="true">view_column</span>
  <span>{{ i18n.messages().columns.button }}</span>
</button>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="open()"
  [cdkConnectedOverlayPositions]="positions"
  (overlayOutsideClick)="close(false)"
  (overlayKeydown)="onKeydown($event)"
  (detach)="close(false)">
  <div
    class="smt-columns__panel"
    role="dialog"
    [id]="panelId"
    [attr.aria-labelledby]="panelId + '-title'"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true">
    <p class="smt-columns__title" [id]="panelId + '-title'">{{ i18n.messages().columns.title }}</p>
    <ul class="smt-columns__list">
      @for (row of rows(); track row.key; let first = $first; let last = $last) {
        <li class="smt-columns__item">
          <input
            type="checkbox"
            class="smt-columns__check"
            [id]="panelId + '-' + row.key"
            [checked]="row.visible"
            [disabled]="row.locked || (row.visible && visibleCount() === 1)"
            (change)="setVisible(row, $any($event.target).checked)" />
          <label class="smt-columns__label" [for]="panelId + '-' + row.key">
            {{ row.label }}
            @if (row.locked) {
              <span class="smt-columns__locked">{{ i18n.messages().columns.locked }}</span>
            }
          </label>
          <button
            type="button"
            class="smt-columns__move"
            [attr.data-column]="row.key"
            data-move="-1"
            [attr.aria-label]="i18n.messages().columns.moveUp(row.label)"
            [disabled]="first"
            (click)="move(row, -1)">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_upward</span>
          </button>
          <button
            type="button"
            class="smt-columns__move"
            [attr.data-column]="row.key"
            data-move="1"
            [attr.aria-label]="i18n.messages().columns.moveDown(row.label)"
            [disabled]="last"
            (click)="move(row, 1)">
            <span class="material-symbols-outlined" aria-hidden="true">arrow_downward</span>
          </button>
        </li>
      }
    </ul>
    <p class="sr-only" role="status">{{ announcement() }}</p>
    <div class="smt-columns__footer">
      <button type="button" class="smt-columns__reset" (click)="reset()">{{ i18n.messages().columns.reset }}</button>
    </div>
  </div>
</ng-template>
