server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: dwh-control-plane
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CP_DB_URL:jdbc:postgresql://localhost:5432/dwh_control_plane}
    username: ${CP_DB_USER:postgres}
    password: ${CP_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ControlPlaneHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    # NFR-10 / ADR-0007 2.3 — паритет с instance: приложение НЕ мигрирует схему.
    # Миграции: --spring.profiles.active=migrate. При старте — SchemaVersionGate.
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  server:
    port: 9091
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
