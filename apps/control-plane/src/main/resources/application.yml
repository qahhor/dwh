server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: dwh-control-plane
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${CP_DB_URL:jdbc:postgresql://localhost:5432/dwh_control_plane}
    username: ${CP_DB_USER:postgres}
    password: ${CP_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: ControlPlaneHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
