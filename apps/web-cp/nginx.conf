# Раздача панели управления и проксирование её API на control plane.
server {
    # 8080 вместо 80: контейнер работает под non-root, порты <1024 недоступны
    listen 8080;
    server_name _;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'report-sample'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    root /usr/share/nginx/html;
    index index.html;

    # Проверка живости самого nginx — не зависит от control plane
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        # Встроенный DNS Docker + переменная в proxy_pass = резолвинг на каждый
        # запрос. Без этого nginx кэширует IP со старта и после пересоздания
        # control plane отдаёт 502, пока сам не будет перезапущен.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $upstream_cp control-plane:8081;
        proxy_pass http://$upstream_cp$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA-роутинг: любой неизвестный путь отдаёт index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты с хешем в имени можно кэшировать надолго
    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
