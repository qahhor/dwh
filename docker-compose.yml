name: ${PROJECT_NAME:-smartupcms}

x-server-environment: &server-environment
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -Djava.security.egd=file:/dev/./urandom -Duser.timezone=UTC"
  DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-smartupcms}
  DB_USER: ${DB_USER:-smartupcms}
  DB_PASSWORD: ${DB_PASSWORD:-smartupcms_local_dev}
  WAREHOUSE_URL: jdbc:postgresql://postgres:5432/${WAREHOUSE_DB_NAME:-smartupcms_dwh}
  WAREHOUSE_USERNAME: ${DB_USER:-smartupcms}
  WAREHOUSE_PASSWORD: ${DB_PASSWORD:-smartupcms_local_dev}
  WAREHOUSE_CONNECT_TIMEOUT: ${WAREHOUSE_CONNECT_TIMEOUT:-5s}
  WAREHOUSE_STATEMENT_TIMEOUT: ${WAREHOUSE_STATEMENT_TIMEOUT:-60s}
  WAREHOUSE_MAINTENANCE_STATEMENT_TIMEOUT: ${WAREHOUSE_MAINTENANCE_STATEMENT_TIMEOUT:-30m}
  WAREHOUSE_RAW_WRITE_TIMEOUT: ${WAREHOUSE_RAW_WRITE_TIMEOUT:-30m}
  SMC_DB_STATEMENT_TIMEOUT: ${SMC_DB_STATEMENT_TIMEOUT:-60s}
  SMC_DB_IDLE_IN_TRANSACTION_TIMEOUT: ${SMC_DB_IDLE_IN_TRANSACTION_TIMEOUT:-60s}
  # Journal retention (docs/ops/operations-runbook.md, ADR-0025): days a row lives; 0 keeps a journal whole.
  SMC_RETENTION_CRON: ${SMC_RETENTION_CRON:-0 30 3 * * *}
  SMC_RETENTION_BATCH_SIZE: ${SMC_RETENTION_BATCH_SIZE:-5000}
  SMC_RETENTION_MAX_BATCHES: ${SMC_RETENTION_MAX_BATCHES:-200}
  SMC_RETENTION_SECURITY_EVENTS_DAYS: ${SMC_RETENTION_SECURITY_EVENTS_DAYS:-365}
  SMC_RETENTION_LOGIN_ATTEMPTS_DAYS: ${SMC_RETENTION_LOGIN_ATTEMPTS_DAYS:-30}
  SMC_RETENTION_OTP_CODES_DAYS: ${SMC_RETENTION_OTP_CODES_DAYS:-7}
  SMC_RETENTION_PASSWORD_RESET_CODES_DAYS: ${SMC_RETENTION_PASSWORD_RESET_CODES_DAYS:-7}
  SMC_RETENTION_CLOSED_SESSIONS_DAYS: ${SMC_RETENTION_CLOSED_SESSIONS_DAYS:-90}
  SMC_RETENTION_WEBHOOK_LOGS_DAYS: ${SMC_RETENTION_WEBHOOK_LOGS_DAYS:-90}
  SMC_RETENTION_WEBHOOK_OUTBOX_DAYS: ${SMC_RETENTION_WEBHOOK_OUTBOX_DAYS:-30}
  SMC_RETENTION_INBOX_DAYS: ${SMC_RETENTION_INBOX_DAYS:-180}
  SMC_RETENTION_NOTIFICATION_OUTBOX_DAYS: ${SMC_RETENTION_NOTIFICATION_OUTBOX_DAYS:-30}
  SMC_RETENTION_JOB_RUNS_DAYS: ${SMC_RETENTION_JOB_RUNS_DAYS:-90}
  SMC_RETENTION_FAILED_JOBS_DAYS: ${SMC_RETENTION_FAILED_JOBS_DAYS:-90}
  SMC_RETENTION_SEARCH_JOBS_DAYS: ${SMC_RETENTION_SEARCH_JOBS_DAYS:-90}
  SMC_JOBS_MAX_ATTEMPTS: ${SMC_JOBS_MAX_ATTEMPTS:-5}
  SMC_JOBS_RETRY_BACKOFF: ${SMC_JOBS_RETRY_BACKOFF:-30s}
  SMC_JOBS_RETRY_BACKOFF_MAX: ${SMC_JOBS_RETRY_BACKOFF_MAX:-1h}
  SMC_JOBS_LEASE: ${SMC_JOBS_LEASE:-5m}
  SMC_INSTANCE_CLIENT_CODE: ${ORGANIZATION_CODE:-local}
  SMC_INSTANCE_CLIENT_NAME: ${ORGANIZATION_NAME:-Local Organization}
  SMC_INSTANCE_RESOURCE_PROFILE: ${RESOURCE_PROFILE:-S}
  SMC_INSTANCE_ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
  SMC_INSTANCE_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@localhost}
  SMC_INSTANCE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DevOnly-ChangeMe-1}
  SMC_PROVIDER_STORAGE: ${SMC_PROVIDER_STORAGE:-local_disk}
  SMC_STORAGE_LOCAL_PATH: /var/lib/smartupcms/storage
  SMC_BACKUP_STATUS_FILE: /var/lib/smartupcms/backup/status.json
  SMC_SYSTEM_HEALTH_TIMEOUT: ${SMC_SYSTEM_HEALTH_TIMEOUT:-2s}
  SMC_BACKUP_MAX_AGE: ${SMC_BACKUP_MAX_AGE:-0s}
  SMC_WEBHOOKS_ENABLED: ${SMC_WEBHOOKS_ENABLED:-false}
  SMC_WEBHOOKS_ALLOWED_HOSTS: ${SMC_WEBHOOKS_ALLOWED_HOSTS:-}
  SMC_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES: ${SMC_WEBHOOKS_ALLOW_PRIVATE_ADDRESSES:-false}
  SMC_WEBHOOKS_CONNECT_TIMEOUT: ${SMC_WEBHOOKS_CONNECT_TIMEOUT:-3s}
  SMC_WEBHOOKS_READ_TIMEOUT: ${SMC_WEBHOOKS_READ_TIMEOUT:-10s}
  SMC_S3_ENDPOINT: ${SMC_S3_ENDPOINT:-}
  SMC_S3_REGION: ${SMC_S3_REGION:-auto}
  SMC_S3_ACCESS_KEY: ${SMC_S3_ACCESS_KEY:-}
  SMC_S3_SECRET_KEY: ${SMC_S3_SECRET_KEY:-}
  SMC_S3_BUCKET: ${SMC_S3_BUCKET:-}
  SMC_S3_PATH_STYLE: ${SMC_S3_PATH_STYLE:-true}
  SMC_FILE_SCANNER_REQUIRED: ${SMC_FILE_SCANNER_REQUIRED:-false}
  SMC_FILE_SCANNER_CLAMAV_ENABLED: ${SMC_FILE_SCANNER_CLAMAV_ENABLED:-false}
  SMC_FILE_SCANNER_CLAMAV_HOST: ${SMC_FILE_SCANNER_CLAMAV_HOST:-clamav}
  SMC_FILE_SCANNER_CLAMAV_PORT: ${SMC_FILE_SCANNER_CLAMAV_PORT:-3310}
  SMC_FILE_SCANNER_CLAMAV_CONNECT_TIMEOUT: ${SMC_FILE_SCANNER_CLAMAV_CONNECT_TIMEOUT:-3s}
  SMC_FILE_SCANNER_CLAMAV_READ_TIMEOUT: ${SMC_FILE_SCANNER_CLAMAV_READ_TIMEOUT:-60s}
  SMC_PUBLIC_URL: ${SMC_PUBLIC_URL:-http://localhost:4200}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMC_MAIL_FROM: ${SMC_MAIL_FROM:-no-reply@localhost}
  SMC_MAIL_FROM_NAME: ${SMC_MAIL_FROM_NAME:-SmartupCMS}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  SMC_PROVIDER_MAIL: ${SMC_PROVIDER_MAIL:-console_mail}
  SMC_PROVIDER_SMS: ${SMC_PROVIDER_SMS:-console_sms}
  SMC_PROVIDER_MESSENGER: ${SMC_PROVIDER_MESSENGER:-console_messenger}
  # Local stand: the log is the channel, so two-factor users on stubs do not stop the start.
  SMC_DELIVERY_ENFORCE: ${SMC_DELIVERY_ENFORCE:-false}
  # ADR-0029: the key of the secrets kept in the database. Empty: the dev profile uses its fixed development key;
  # any other SPRING_PROFILE needs a key of its own (openssl rand -base64 32).
  SMC_SECRETS_KEY: ${SMC_SECRETS_KEY:-}
  SMC_TYPESENSE_URL: http://typesense:8108
  SMC_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-smartupcms_typesense_local_dev}
  SMC_TYPESENSE_ENABLED: ${SMC_TYPESENSE_ENABLED:-true}
  SMC_RATE_LIMIT_USER_PER_MINUTE: ${SMC_RATE_LIMIT_USER_PER_MINUTE:-600}
  MANAGEMENT_PORT: 9090
  TZ: UTC

services:
  postgres:
    build:
      context: deploy/images/postgres
      dockerfile: Dockerfile
    image: ${POSTGRES_IMAGE:-smartupcms/postgres:18-alpine-hardened}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-smartupcms}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-smartupcms_dwh}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-smartupcms_local_dev}}
      POSTGRES_INITDB_ARGS: "--data-checksums"
      MIGRATE_DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${DB_PASSWORD:-smartupcms_local_dev}}
      APP_DB_USER: ${DB_USER:-smartupcms}
      APP_DB_PASSWORD: ${DB_PASSWORD:-smartupcms_local_dev}
      BACKUP_DB_USER: ${BACKUP_DB_USER:-smartupcms_backup}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-${DB_PASSWORD:-smartupcms_local_dev}}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${DB_NAME:-smartupcms}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build: {context: .}
    image: ${IMAGE_REGISTRY:-smartupcms}/server:${APP_VERSION:-dev}
    profiles: [tools]
    restart: "no"
    # ADR-0001, two databases: MigrateMain applies db/dwh only (SMC_MIGRATE_SCOPE=warehouse, connecting with the
    # WAREHOUSE_* settings of server-environment), then the regular migrate profile
    # applies db/migration as before (SPRING_FLYWAY_TARGET and other Flyway settings keep working).
    # WarehouseSchemaVersionGate checks pg-dwh on every Spring context start (the migrate profile included),
    # so db/dwh has to be applied before the first context start. All arguments are inline: nothing is lost in sh -c.
    entrypoint: ["sh", "-c"]
    command:
      - >-
        java -cp app.jar com.smartup24.cms.instance.warehouse.migration.MigrateMain
        && exec java -jar app.jar --spring.profiles.active=migrate
    environment:
      <<: *server-environment
      DB_USER: ${MIGRATE_DB_USER:-smartupcms_migrator}
      DB_PASSWORD: ${MIGRATE_DB_PASSWORD:-${DB_PASSWORD:-smartupcms_local_dev}}
      SMC_MIGRATE_SCOPE: warehouse
    depends_on:
      postgres: {condition: service_healthy}

  server:
    build: {context: .}
    image: ${IMAGE_REGISTRY:-smartupcms}/server:${APP_VERSION:-dev}
    restart: unless-stopped
    command: ["--spring.profiles.active=${SPRING_PROFILE:-dev}"]
    environment: *server-environment
    volumes:
      - server-data:/var/lib/smartupcms
      - backup-status:/var/lib/smartupcms/backup:ro
    depends_on:
      postgres: {condition: service_healthy}
      typesense: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9090/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 60s

  web:
    build: {context: ./apps/web}
    image: ${IMAGE_REGISTRY:-smartupcms}/web:${APP_VERSION:-dev}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4200}:8080"
      # The second origin the e2e suite runs on (ci.yml); another host port: E2E_WEB_PORT.
      - "${E2E_WEB_PORT:-4201}:8080"
    depends_on:
      server: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 15s

  typesense:
    build:
      context: .
      dockerfile: deploy/images/typesense/Dockerfile
    image: ${TYPESENSE_IMAGE:-smartupcms/typesense:27.1-hardened}
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-smartupcms_typesense_local_dev}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "false"
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec "exec 3<>/dev/tcp/127.0.0.1/8108;
          printf 'GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          grep -q '\"ok\":true' <&3"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  backup-bootstrap:
    build:
      context: ./deploy/images/backup
    image: ${IMAGE_REGISTRY:-smartupcms}/backup:${APP_VERSION:-dev}
    profiles: [tools]
    restart: "no"
    entrypoint: ["/usr/local/bin/bootstrap-role"]
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-smartupcms}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-smartupcms_dwh}
      PGUSER: ${DB_USER:-smartupcms}
      PGPASSWORD_FILE: /run/secrets/database_password
      BACKUP_DB_USER: ${BACKUP_DB_USER:-smartupcms_backup}
      BACKUP_DB_PASSWORD_FILE: /run/secrets/backup_database_password
    secrets: [database_password, backup_database_password]
    depends_on:
      postgres: {condition: service_healthy}

  backup:
    build:
      context: ./deploy/images/backup
    image: ${IMAGE_REGISTRY:-smartupcms}/backup:${APP_VERSION:-dev}
    profiles: [backup]
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGDATABASE: ${DB_NAME:-smartupcms}
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME:-smartupcms_dwh}
      PGUSER: ${BACKUP_DB_USER:-smartupcms_backup}
      PGPASSWORD_FILE: /run/secrets/backup_database_password
      AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_STORAGE_MODE: ${BACKUP_STORAGE_MODE:-local}
    secrets: [backup_database_password]
    volumes:
      - backups:/backups
      - backup-status:/status
    depends_on:
      postgres: {condition: service_healthy}

secrets:
  database_password:
    file: ${DB_PASSWORD_FILE:-deploy/compose/.secrets/database-password}
  backup_database_password:
    file: ${BACKUP_DB_PASSWORD_FILE:-deploy/compose/.secrets/backup-database-password}

volumes:
  postgres-data:
  server-data:
  typesense-data:
  backups:
  backup-status:
