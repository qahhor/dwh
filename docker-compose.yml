version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dwh-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dwh_instance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dwh_instance"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
