# Весь проект одной группой в Docker.
#
# Имя группы берётся из PROJECT_NAME (файл .env), по умолчанию SmartupCMS.
# ВНИМАНИЕ: Docker Compose приводит имя проекта к нижнему регистру, поэтому
# в Docker Desktop группа отображается как `smartupcms`. Имена контейнеров
# регистр сохраняют: SmartupCMS-app, SmartupCMS-db и т. д.
#
# Запуск (порядок обязателен — миграции отдельным шагом, NFR-10):
#   cp .env.example .env
#   docker compose run --rm migrate
#   docker compose up -d
#
# Прод-развёртывание одного клиента — deploy/compose/docker-compose.prod.yml.

name: ${PROJECT_NAME:-SmartupCMS}

x-instance-env: &instance-env
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1024m -XX:+ExitOnOutOfMemoryError -XX:+UseZGC -Djava.security.egd=file:/dev/./urandom -Duser.timezone=UTC"
  DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-dwh_instance}
  DB_USER: ${DB_USER:-dwh}
  DB_PASSWORD: ${DB_PASSWORD:-dwh_local_dev}
  DWH_INSTANCE_CLIENT_CODE: ${CLIENT_CODE:-dev-local}
  DWH_INSTANCE_CLIENT_NAME: ${CLIENT_NAME:-Local Development}
  DWH_INSTANCE_RESOURCE_PROFILE: ${RESOURCE_PROFILE:-S}
  DWH_INSTANCE_ADMIN_LOGIN: ${ADMIN_LOGIN:-admin}
  DWH_INSTANCE_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@dev.local}
  DWH_INSTANCE_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-DevOnly-ChangeMe-1}
  # Каналы доставки (FR-NOTIF-3/4/5). Пустой SMTP_HOST или TELEGRAM_BOT_TOKEN
  # означает заглушку: письма и коды пишутся в журнал и никуда не уходят.
  # Чтобы канал заработал, нужны ОБА параметра: адрес шлюза и выбор провайдера.
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  DWH_MAIL_FROM: ${DWH_MAIL_FROM:-no-reply@localhost}
  DWH_MAIL_FROM_NAME: ${DWH_MAIL_FROM_NAME:-DWH Platform}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  DWH_PROVIDER_MAIL: ${DWH_PROVIDER_MAIL:-console_mail}
  DWH_PROVIDER_SMS: ${DWH_PROVIDER_SMS:-console_sms}
  DWH_PROVIDER_MESSENGER: ${DWH_PROVIDER_MESSENGER:-console_messenger}
  DWH_TYPESENSE_URL: ${DWH_TYPESENSE_URL:-http://typesense:8108}
  DWH_TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dwh_typesense_local_dev_key}
  DWH_TYPESENSE_ENABLED: ${DWH_TYPESENSE_ENABLED:-true}
  MANAGEMENT_PORT: 9090          # порт для HEALTHCHECK образа
  TZ: UTC



services:
  # ------------------------------------------------------------ экземпляр
  db:
    build:
      context: .
      dockerfile: deploy/images/postgres/Dockerfile
    image: ${POSTGRES_IMAGE:-smartupcms/postgres:18-alpine-hardened}
    container_name: ${PROJECT_NAME:-SmartupCMS}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-dwh_instance}
      POSTGRES_USER: ${DB_USER:-dwh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dwh_local_dev}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${DB_PORT:-5432}:5432"     # наружу только для отладки в dev
    volumes:
      - db-data:/var/lib/postgresql   # PG 18: том монтируется на каталог целиком, не на /data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dwh} -d ${DB_NAME:-dwh_instance}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  migrate:
    build: {context: .}
    image: ${IMAGE_REGISTRY:-smartupcms}/instance:${APP_VERSION:-dev}
    container_name: ${PROJECT_NAME:-SmartupCMS}-migrate
    profiles: [tools]              # не поднимается вместе со стеком
    restart: "no"
    command: ["--spring.profiles.active=migrate"]
    environment: *instance-env
    depends_on:
      db: {condition: service_healthy}

  app:
    build: {context: .}
    image: ${IMAGE_REGISTRY:-smartupcms}/instance:${APP_VERSION:-dev}
    container_name: ${PROJECT_NAME:-SmartupCMS}-app
    restart: unless-stopped
    command: ["--spring.profiles.active=${SPRING_PROFILE:-dev}"]
    environment: *instance-env
    ports:
      - "${APP_PORT:-8080}:8080"
      - "${APP_MGMT_PORT:-9190}:9090"   # actuator: в проде наружу НЕ публикуется
    volumes:
      - app-files:/var/lib/dwh          # ВРЕМЕННО до Garage/S3 (блокер C-3)
    depends_on:
      db: {condition: service_healthy}

  # ------------------------------------------------------------- фронтенд
  web:
    build: {context: ./apps/web-instance}
    image: ${IMAGE_REGISTRY:-smartupcms}/web:${APP_VERSION:-dev}
    container_name: ${PROJECT_NAME:-SmartupCMS}-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-4200}:8080"
    depends_on:
      - app

  # ------------------------------------------------------------- поиск (Typesense)
  typesense:
    build:
      context: .
      dockerfile: deploy/images/typesense/Dockerfile
    image: ${TYPESENSE_IMAGE:-smartupcms/typesense:27.1-hardened}

    container_name: ${PROJECT_NAME:-SmartupCMS}-typesense
    restart: unless-stopped
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-dwh_typesense_local_dev_key}
      TYPESENSE_DATA_DIR: /data
      TYPESENSE_ENABLE_CORS: "true"
    ports:
      - "${TYPESENSE_PORT:-8108}:8108"
    volumes:
      - typesense-data:/data

volumes:
  db-data:
  app-files:
  typesense-data:

