# ZAP baseline rules (plan 10/10, item 7.7), read by scripts/security/run-zap-baseline.ps1 for both scans.
# Format: <plugin id><TAB><IGNORE|INFO|WARN|FAIL><TAB>(<rule name>). Rules not listed keep their default (WARN).
# A High alert fails the run unless its rule is IGNOREd here; an IGNORE needs a reason on the line above it,
# and is never used to hide a real issue: fix the issue, or record it with an owner in docs/security/threat-model.md.
# The scan is unauthenticated: every protected API operation answers 400/401/403 by design (2026-10-07: 229
# instances, all expected). The rule only counts error status codes and would bury the real findings.
100000	IGNORE	(A Client Error response code was returned by the server)
# Kept as a visible warning, never ignored: the SPA CSP allows style-src 'unsafe-inline' because Angular inserts the
# styles of its components as <style> elements at run time; script-src stays 'self' only. Reasoning and the nonce
# alternative: ADR-0034, section 2.1. The same rule still reports any other CSP weakness.
10055	WARN	(CSP)
