# The infrastructure of a local run from the sources (plan 10/10, item 6.5), used by scripts/dev/run-local.sh and
# scripts/dev/run-local.ps1 together with docker-compose.yml: PostgreSQL (both databases, the main one and pg-dwh) and
# Typesense come from docker-compose.yml; this file adds the mail stub with its SMTP port published, because the server
# runs on the host and not in the Compose network. Only the infrastructure services are started from it; the server
# and the web application run from the sources. Never part of a deployment. Other host ports: MAILPIT_HTTP_PORT,
# MAILPIT_SMTP_PORT (and DB_PORT, TYPESENSE_PORT of docker-compose.yml).
services:
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: "500"
      TZ: UTC
    ports:
      - "127.0.0.1:${MAILPIT_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
